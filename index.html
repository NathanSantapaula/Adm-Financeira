  const M = cartModel(); const { items } = M;
  RI = 0; FIRST_ED = true;

  const okAlvo = Math.abs(M.sumAlvo - 100) < 0.05;
  const alvoChip = M.sumAlvo <= 0
    ? '<span class="chip warn">Defina o alvo (%) de cada ativo</span>'
    : okAlvo ? '<span class="chip ok">Alvos somam 100%</span>' : `<span class="chip warn">Alvos somam ${fmtPct(M.sumAlvo)}. Normalize para 100%</span>`;

  const cm = items.filter((i) => i.sug > 0.004).sort((a, b) => b.sug - a.sug);
  const out = M.rb.W <= 0
    ? '<p class="mmsg">Informe o percentual-alvo dos ativos na tabela abaixo para ver onde investir.</p>'
    : M.aporte <= 0 ? '<p class="mmsg">Informe um valor de aporte maior que zero.</p>' : `<ol class="alloc">${cm.map((i) => `<li><span class="a-n">${esc(i.a.nome)}<small>${esc(i.a.classe)}</small></span><span class="a-p">${i.cotas != null ? `≈ ${i.cotas} ${i.cotas === 1 ? 'cota' : 'cotas'}` : ''}</span><span class="a-v">${brl(i.sug)}</span></li>`).join('')}</ol>
      <p class="cap">O aporte vai primeiro para os ativos mais abaixo do alvo, sem vender nada. Se todos já estiverem no alvo, divide pelos percentuais. Os valores são sugestões calculadas a partir das metas que você definiu.</p>`;

  const mesSel = `<select data-cart="mes" aria-label="Mês do aporte">${MES.map((m, i) => `<option value="${i}" ${M.mes === i ? 'selected' : ''}>${m}</option>`).join('')}</select>`;
  const painel = `<div class="panel cart-top">
    <div class="cart-in">
      <label class="fld"><span>Mês do aporte</span>${mesSel}</label>
      <label class="fld"><span>Valor do aporte <small>${S.cart.aporte == null ? '(planejado)' : '(digitado)'}</small></span><input class="in-s" data-cart="aporte" inputmode="decimal" value="${nf.format(M.aporte)}" aria-label="Valor do aporte em reais"></label>
      ${S.cart.aporte != null ? '<button class="btn" data-act="cart-auto">Usar valor planejado</button>' : ''}
    </div>
    <div class="cart-out"><h3>Onde investir ${brl(M.aporte)} em ${MES[M.mes]}</h3>${out}
      ${cm.length ? `<div class="btn-row"><button class="btn primary" data-act="cart-register">Registrar em Investimentos (${MES[M.mes]})</button></div>` : ''}</div></div>`;

  // equilíbrio por classe
  const byClass = [];
  items.forEach((i) => {
    let g = byClass.find((x) => x.classe === i.a.classe && x.tipo === i.a.tipo);
    if (!g) { g = { tipo: i.a.tipo, classe: i.a.classe, items: [] }; byClass.push(g); }
    g.items.push(i);
  });
  const clsRows = byClass.map((g) => {
    const at = g.items.reduce((s, i) => s + i.pctAtual, 0); const al = g.items.reduce((s, i) => s + i.pctAlvo, 0);
    const maxv = Math.max(40, at, al);
    return `<tr><td>${esc(g.classe)}</td><td><div class="meter" role="img" aria-label="Atual ${fmtPct(at)}, alvo ${fmtPct(al)}"><i style="width:${(at / maxv) * 100}%"></i><b style="left:${(al / maxv) * 100}%"></b></div></td><td class="num">${fmtPct(al)}</td><td class="num">${fmtPct(at)}</td><td class="num ${at - al < -0.05 ? 'under' : at - al > 0.05 ? 'over' : ''}">${fmtPp(at - al)}</td></tr>`;
  }).join('');
  const classTbl = M.rb.W > 0 ? `<div class="sec-h"><div><h3>Equilíbrio por classe</h3><p>A barra mostra quanto a classe pesa hoje; o traço marca o alvo.</p></div></div>
    <div class="panel"><table class="mini"><thead><tr><th>Classe</th><th></th><th class="num">Alvo</th><th class="num">Atual</th><th class="num">Desvio</th></tr></thead><tbody>${clsRows}</tbody></table></div>` : '';

  // tabela principal (ativos)
  let body = '';
  byClass.forEach((g) => {
    const s = (f) => g.items.reduce((a, i) => a + f(i), 0);
    body += `<tr class="r-g d1"><td class="lab"><div class="in" style="--d:0"><span>${esc(g.classe)}</span></div></td><td class="num">${fmtPct(s((i) => i.alvo))}</td><td class="num">${fmt(s((i) => i.valor))}</td><td class="num"></td><td class="num">${fmtPct(s((i) => i.pctAtual))}</td><td class="num">${fmtPp(s((i) => i.desvio))}</td><td class="num">${fmt(s((i) => i.sug))}</td><td class="num"></td></tr>`;
    g.items.forEach((i) => {
      const ri = RI++;
      const ed = (k, col, v, o) => cell(v, col, Object.assign({ k, id: i.k, ri, col: true }, o || {}));
      body += `<tr><td class="lab"><div class="in" style="--d:1"><span>${esc(i.a.nome)}</span></div></td>${ed('al', 0, i.alvo, { fmt: 'pct' })}${ed('va', 1, i.valor, { auto: i.auto })}${ed('pc', 2, i.preco || 0)}<td class="num${i.pctAtual < 0.005 ? ' z' : ''}">${fmtPct(i.pctAtual)}</td><td class="num ${i.desvio < -0.05 ? 'under' : i.desvio > 0.05 ? 'over' : 'z'}">${fmtPp(i.desvio)}</td><td class="num sug${i.sug > 0 ? ' pos' : ' z'}">${fmt(i.sug)}</td><td class="num${i.cotas ? '' : ' z'}">${i.cotas != null ? i.cotas : '–'}</td></tr>`;
    });
  });
  body += `<tr class="r-total"><td class="lab"><div class="in"><span>Total</span></div></td><td class="num">${fmtPct(M.sumAlvo)}</td><td class="num">${fmt(M.total)}</td><td class="num"></td><td class="num">${M.total > 0 ? '100%' : '–'}</td><td class="num"></td><td class="num">${fmt(items.reduce((a, i) => a + i.sug, 0))}</td><td class="num"></td></tr>`;
  const tbl = `<div class="tablewrap"><table class="grid grid-cart"><thead><tr><th class="lab">Ativo</th><th>Alvo (%)</th><th>Posição atual (R$)</th><th>Preço (R$)</th><th>Atual (%)</th><th>Desvio</th><th>Aporte sugerido (R$)</th><th>Cotas</th></tr></thead><tbody>${body}</tbody></table></div>
    <p class="cap" style="margin-top:10px">Posição atual: soma dos aportes de todos os anos, a menos que você digite o valor de mercado (apague para voltar ao automático). Preço é opcional e serve para estimar as cotas.</p>`;

  const acts = `${alvoChip}<button class="btn" data-act="cart-norm">Normalizar para 100%</button><button class="btn" data-act="cart-equal">Distribuir igualmente</button><button class="btn" data-act="cart-clear">Limpar alvos</button>`;
  return `${mobBar()}${pageHead('Carteira', 'Adapte a alocação-alvo à sua carteira. A cada aporte mensal, veja onde investir para manter tudo equilibrado.', '')}
    <div class="acts" style="margin-bottom:14px">${acts}</div>${painel}${classTbl}<div class="sec-h"><div><h3>Alvo e posição por ativo</h3></div></div>${tbl}
    <p class="cap disc">Ferramenta de organização. As sugestões seguem os percentuais-alvo definidos por você e não constituem recomendação individual de investimento.</p>`;
}

function cartNormalize() {
  const items = cartModel().items; const s = items.reduce((a, i) => a + i.alvo, 0);
  if (s <= 0) { toast('Defina ao menos um alvo antes de normalizar.'); return; }
  items.forEach((i) => { if (i.alvo > 0) cartEntry(i.k, true).alvo = E.r2((i.alvo / s) * 100); });
  const rest = items.map((i) => cartEntry(i.k, false)).filter((e) => e && e.alvo > 0);
  const diff = E.r2(100 - rest.reduce((a, e) => a + e.alvo, 0));
  if (rest.length && Math.abs(diff) > 0) rest[rest.length - 1].alvo = E.r2(rest[rest.length - 1].alvo + diff);
  touch('profile'); render();
}
function cartEqual() {
  const items = cartModel().items; const n = items.length; if (!n) return;
  let acc = 0;
  items.forEach((i, idx) => { const v = idx === n - 1 ? E.r2(100 - acc) : E.r2(100 / n); acc += v; cartEntry(i.k, true).alvo = v; });
  touch('profile'); render();
}
function cartClear() { S.profile.carteira.forEach((e) => { e.alvo = 0; }); touch('profile'); render(); }
function cartRegister() {
  const M = cartModel(); const list = M.items.filter((i) => i.sug > 0.004);
  if (!list.length) return;
  confirmBox(`Registrar aportes de ${MES[M.mes]}?`, `Os ${list.length} valores sugeridos (${brl(list.reduce((a, i) => a + i.sug, 0))}) serão somados aos aportes de ${MES[M.mes]} na aba Investimentos.`, 'Registrar', () => {
    list.forEach((i) => { i.a.ap[M.mes] = E.r2((+i.a.ap[M.mes] || 0) + i.sug); });
    S.cart.aporte = null; touch('plan'); render(); toast('Aportes registrados em Investimentos.');
  });
}

function readOb(f) {
  const d = new FormData(f); const o = S.ob; const err = (m) => { $('#oerr').textContent = m; return false; };
  if (o.step === 0) {
    const nome = String(d.get('nome') || '').trim();
    if (nome.length < 2) return err('Informe seu nome.');
    o.nome = nome; o.anoRef = +d.get('anoRef');
  } else if (o.step === 1) {
    o.abas = ['geral'].concat(d.getAll('aba').filter((k) => ABA_KEYS.includes(k) && k !== 'geral'));
  } else {
    const num = (k, req) => { const raw = String(d.get(k) || '').replace('%', ''); if (!raw.trim() && !req) return 0; const v = E.parseValor(raw); return v; };
    const mb = num('metaBase', true); const ma = num('metaInvAno', false); const pd = num('pctDesp', true);
    if ([mb, ma, pd].some((v) => Number.isNaN(v) || v < 0)) return err('Confira os valores: use números como 1.234,56.');
    if (pd > 100) return err('O percentual do salário para despesas deve ficar entre 0 e 100.');
    o.metaBase = mb; o.metaInvAno = ma; o.pctDesp = pd;
  }
  return true;
}

/* ===== importação .xlsx ===== */
function loadXlsx() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (loadXlsx.p) return loadXlsx.p;
  loadXlsx.p = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    s.onload = () => res(window.XLSX);
    s.onerror = () => { loadXlsx.p = null; rej(new Error('xlsx')); };
    document.head.appendChild(s);
  });
  return loadXlsx.p;
}

async function downloadTemplate() {
  let arr;
  try {
    const X = await loadXlsx(); const wb = X.utils.book_new();
    E.templateSheets().forEach((sh) => {
      const ws = X.utils.aoa_to_sheet(sh.rows);
      ws['!cols'] = sh.name === 'Instruções' ? [{ wch: 130 }] : sh.rows[0].map((_, i) => ({ wch: i < 5 ? 22 : 10 }));
      X.utils.book_append_sheet(wb, ws, sh.name);
    });
    arr = X.write(wb, { bookType: 'xlsx', type: 'array' });
  } catch (e) { toast('Não foi possível carregar o gerador de planilhas. Verifique a conexão e tente de novo.'); return; }
  save('financial-planning-modelo.xlsx', new Uint8Array(arr));
}

async function readImportFile(file) {
  const mode = S.imp.mode;
  S.imp = { state: 'reading', mode, name: file.name }; renderAdmin();
  try {
    const X = await loadXlsx(); const buf = await file.arrayBuffer();
    const wb = X.read(buf, { type: 'array' });
    const sheets = wb.SheetNames.map((n) => ({ name: n, rows: X.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: true }) }));
    S.imp = { state: 'ready', mode, name: file.name, parsed: E.parseImport(sheets) };
  } catch (e) {
    S.imp = { state: 'error', mode, name: file.name, msg: 'Não foi possível ler o arquivo. Confirme que é um .xlsx válido e que a conexão está ativa.' };
  }
  renderAdmin();
}

function applyImportNow() {
  if (gated('importar') || !S.plan || S.imp.state !== 'ready') return;
  const { parsed, mode } = S.imp;
  const r = E.applyImport(S.plan, S.profile.carteira, parsed, mode, uid);
  touch('plan'); if (parsed.found.cart) touch('profile');
  S.imp = { state: 'idle', mode };
  render(); renderAdmin();
  const parts = [];
  if (r.rendas) parts.push(`${r.rendas} rendas`);
  if (r.lancamentos) parts.push(`${r.lancamentos} lançamentos`);
  if (r.ativos) parts.push(`${r.ativos} ativos novos`);
  if (r.carteira) parts.push(`${r.carteira} alvos da carteira`);
  toast('Importação concluída' + (parts.length ? ': ' + parts.join(', ') : '') + (r.ignorados ? ` (${r.ignorados} lançamentos já existiam)` : '') + '.');
}

function setAnoRef(y) {
  if (S.docs[y] || (S.plan && S.plan.year === y)) { S.profile.anoRef = y; touch('profile'); if (!S.plan || S.plan.year !== y) switchYear(y); else render(); return; }
  confirmBox(`Criar o planejamento de ${y}?`, 'A estrutura do ano atual (rendas, despesas e ativos) será copiada com os valores zerados.', 'Criar', async () => {
    await flush();
    S.profile.anoRef = y; touch('profile');
    createPlan(y, S.plan);
  });
}

function onAdminChange(t) {
  if (t.matches('[data-pf]')) {
    const k = t.dataset.pf;
    if (k === 'anoRef') { setAnoRef(+t.value); return true; }
    if (k === 'email' && t.value.trim() && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(t.value.trim())) { toast('Informe um e-mail válido.'); t.value = S.profile.email; return true; }
    if (k === 'nome' && t.value.trim().length < 2) { toast('Informe seu nome.'); t.value = S.profile.nome; return true; }
    S.profile[k] = t.value.trim(); touch('profile'); renderLater();
    const hp = $('.dr-head p', $('#admin')); if (hp) hp.textContent = `${S.profile.nome || 'Minha conta'}, ${planLabel().toLowerCase()}`;
    return true;
  }
  if (t.matches('[data-aba]')) {
    const keys = $$('[data-aba]:checked', $('#admin')).map((x) => x.dataset.aba);
    S.profile.abas = hydrateProfile({ abas: ['geral'].concat(keys.filter((k) => k !== 'geral')) }).abas;
    if (!S.profile.abas.includes(S.view)) S.view = 'geral';
    touch('profile'); renderLater(); return true;
  }
  if (t.matches('[data-imp-mode]')) { S.imp.mode = t.value; return true; }
  if (t.id === 'imp-file') { const f = t.files && t.files[0]; if (f) readImportFile(f); return true; }
  return false;
}

function submitActivate(f) {
  const err = f.querySelector('.merr'); const codigo = new FormData(f).get('codigo');
  if (!ativarCodigo(codigo)) { err.textContent = 'Código inválido. Confira o código enviado pelo ' + firstName() + ' e tente de novo.'; return; }
  toast('Plano completo ativado. Obrigado!');
  if (S.screen === 'checkout') { render(); return; }
  render(); renderAdmin();
}


/* ===== renderização, eventos e início ===== */
function viewHtml() {
  if (!S.plan) return emptyState();
  switch (S.view) {
    case 'rendas': return viewRendas();
    case 'despesas': return viewDespesas();
    case 'inv': return viewAssets('inv');
    case 'pro': return viewAssets('pro');
    case 'cart': return viewCart();
    default: return viewGeral();
  }
}

/* render({soft:true}) é para atualizações em segundo plano (salvamento, sincronização): nunca apaga o que a pessoa está digitando */
function render(opts) {
  const soft = !!(opts && opts.soft);
  if (isEditing() || (soft && isTyping())) { S.needsRender = true; return; }
  if (S.loaded && S.screen === null) resolveScreen();
  const scr = S.loaded ? S.screen : 'loading';
  if (scr === 'app' && !visibleTabs().includes(S.view)) S.view = 'geral';
  const key = scr + ':' + (scr === 'app' ? S.view : scr === 'onboarding' && S.ob ? S.ob.step : '');
  const sameView = S.lastView === key;
  if (soft && scr !== 'app' && sameView) return;
  S.needsRender = false;
  document.body.dataset.screen = scr;
  const y = window.scrollY; const tw = $('.tablewrap'); const tws = tw ? [tw.scrollLeft, tw.scrollTop] : null;
  S.C = S.plan ? E.compute(S.plan) : null;
  hideTip();
  if (scr === 'app') {
    renderSide(); renderBanner();
    $('#view').innerHTML = viewHtml();
  } else {
    $('#side').innerHTML = ''; renderBanner();
    const h = { landing: landingHtml, signup: signupHtml, checkout: checkoutHtml, onboarding: onboardingHtml }[scr];
    $('#view').innerHTML = h ? h() : '<div class="loading">Carregando…</div>';
  }
  const tw2 = $('.tablewrap');
  if (tw2 && tws && sameView) { tw2.scrollLeft = tws[0]; tw2.scrollTop = tws[1]; }
  window.scrollTo(window.scrollX, sameView ? y : 0);
  S.lastView = key;
  drawCharts();
  if (S.pendingFocus) { const c = findCell(S.pendingFocus.ri, S.pendingFocus.m); if (c) c.focus(); S.pendingFocus = null; }
  const ad = $('#admin');
  if (S.adminOpen && ad && ad.open) {
    const ae = document.activeElement;
    if (!(ae && ad.contains(ae) && /INPUT|SELECT|TEXTAREA/.test(ae.tagName))) renderAdmin();
  }
}

/* mudanças vindas de campos (evento change) redesenham depois do clique em curso, para não engolir o clique no botão seguinte */
function renderLater() {
  S.stale = true;
  clearTimeout(S.staleT);
  S.staleT = setTimeout(() => { if (S.stale) { S.stale = false; render(); } }, 450);
}

function confirmNewYear(year) {
  const p = S.plan;
  if (S.years.includes(year)) { toast(`O planejamento de ${year} já existe.`); return; }
  confirmBox(`Criar o planejamento de ${year}?`, 'A estrutura deste ano (rendas, despesas e ativos) será copiada com os valores zerados.', 'Criar', async () => {
    await flush();
    createPlan(year, p);
  });
}

function onClick(e) {
  const tgt = e.target;
  const td = tgt.closest && tgt.closest('td.ed');
  if (td && !td.classList.contains('editing')) {
    let cellEl = td;
    if (S.stale) { const ri = +td.dataset.ri; const m = +td.dataset.m; S.stale = false; render(); cellEl = findCell(ri, m); }
    if (cellEl) startEdit(cellEl);
    return;
  }
  const el = tgt.closest && tgt.closest('[data-act]');
  if (el) {
    const act = el.dataset.act; const p = S.plan;
    switch (act) {
      case 'nav': S.view = el.dataset.view; S.stale = false; closeAdmin(); render(); break;
      case 'toggle': {
        const set = el.dataset.kind === 'desp' ? S.openDesp : S.closed[el.dataset.kind];
        const k = el.dataset.key;
        if (set.has(k)) set.delete(k); else set.add(k);
        S.stale = false; render(); break;
      }
      case 'expand-all': case 'collapse-all': {
        const kind = el.dataset.kind; const open = act === 'expand-all';
        if (kind === 'desp') S.openDesp = open ? new Set(p.despesas.map((d) => d.id)) : new Set();
        else S.closed[kind] = open ? new Set() : new Set(groupKeys(E.buildAssetTree(p.ativos, kind === 'inv' ? 'ap' : 'pro' === kind ? 'pr' : 'ap'), []));
        S.stale = false; render(); break;
      }
      case 'add-renda': openRenda(null, el.dataset.cat); break;
      case 'edit-renda': openRenda(el.dataset.id); break;
      case 'add-desp': openDespesa(); break;
      case 'edit-desp': openDespesa(el.dataset.id); break;
      case 'add-lanc': openLanc(el.dataset.did); break;
      case 'edit-lanc': openLanc(el.dataset.did, el.dataset.id); break;
      case 'add-ativo': openAtivo(); break;
      case 'edit-ativo': openAtivo(el.dataset.id); break;
      case 'create-blank': createPlan(S.year || NOW_Y, null); break;
      case 'new-year': confirmNewYear(+el.dataset.year); break;
      case 'del-year': confirmBox(`Excluir o planejamento de ${p.year}?`, 'Todos os valores e lançamentos deste ano serão apagados. Esta ação não pode ser desfeita.', 'Excluir', () => deletePlan(p.year)); break;
      case 'reset': confirmBox(`Zerar os valores de ${p.year}?`, 'Rendas, lançamentos e valores de investimentos e proventos voltam a zero. A estrutura (fontes, despesas e ativos) é mantida.', 'Zerar valores', () => {
        p.outros = z12(); p.rendas.forEach((r) => { r.v = z12(); }); p.despesas.forEach((d) => { d.lanc = []; }); p.ativos.forEach((a) => { a.ap = z12(); a.pr = z12(); }); commit();
      }); break;
      case 'theme': { const n = { auto: 'light', light: 'dark', dark: 'auto' }[S.theme]; applyTheme(n); lsSet('fluxo:theme', n); render(); if (S.adminOpen) renderAdmin(); break; }
      case 'reading': askReading(); break;
      case 'export-json': save(`financial-planning-${p.year}.json`, JSON.stringify(p, null, 2)); break;
      case 'export-csv-geral': exportGeral(); break;
      case 'export-csv-lanc': exportLanc(); break;
      case 'contact': openContact(); break;
      case 'terms': openTerms(); break;
      case 'entrar': entrar(); break;
      case 'go-signup': if (S.profile) { entrar(); break; } S.signup = Object.assign(S.signup, { plano: el.dataset.plano === 'completo' ? 'completo' : 'gratis', aviso: '' }); S.screen = 'signup'; render(); break;
      case 'goto-landing': closeAdmin(); S.screen = 'landing'; render(); break;
      case 'scroll': { const t = document.getElementById(el.dataset.to); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); break; }
      case 'checkout-continue': S.screen = S.profile.onboarded ? 'app' : 'onboarding'; if (S.screen === 'onboarding') initOb(); render(); break;
      case 'upgrade': iniciarCompleto('app'); break;
      case 'downgrade': S.profile.plano = 'gratis'; S.profile.cobranca = 'ativo'; touch('profile'); render(); renderAdmin(); break;
      case 'ob-back': { const f = $('#f-ob'); if (f) readOb(f); S.ob.step = Math.max(0, S.ob.step - 1); render(); break; }
      case 'admin-open': openAdmin(el.dataset.tab); break;
      case 'admin-close': closeAdmin(); break;
      case 'admin-tab': S.adminTab = el.dataset.tab; renderAdmin(); break;
      case 'download-template': downloadTemplate(); break;
      case 'imp-apply': applyImportNow(); break;
      case 'imp-cancel': S.imp = { state: 'idle', mode: S.imp.mode }; renderAdmin(); break;
      case 'cart-norm': cartNormalize(); break;
      case 'cart-equal': cartEqual(); break;
      case 'cart-clear': cartClear(); break;
      case 'cart-auto': S.cart.aporte = null; render(); break;
      case 'cart-register': cartRegister(); break;
      default: break;
    }
  }
  if (S.stale) { S.stale = false; clearTimeout(S.staleT); render(); }
}

function onSubmit(e) {
  const f = e.target;
  if (f.id === 'f-signup') { e.preventDefault(); submitSignup(f); }
  else if (f.id === 'f-ob') { e.preventDefault(); if (readOb(f)) { if (S.ob.step < 2) { S.ob.step++; render(); } else finishOb(); } }
  else if (f.id === 'f-activate' || f.dataset.form === 'activate') { e.preventDefault(); submitActivate(f); }
}

function onChange(e) {
  const t = e.target;
  if (t.matches('[data-year-select]')) {
    if (t.value === '__new') {
      const next = (S.years.length ? Math.max(...S.years) : S.year || NOW_Y) + 1;
      t.value = String(S.year);
      if (S.plan) confirmNewYear(next); else createPlan(next, null);
    } else switchYear(+t.value);
    return;
  }
  if (t.closest && t.closest('#admin') && onAdminChange(t)) return;
  if (t.matches('[data-setting]') && S.plan) {
    const key = t.dataset.setting; const raw = String(t.value).replace('%', '');
    const v = E.parseValor(raw);
    if (Number.isNaN(v) || v < 0 || (key === 'propostoPct' && v > 100)) { toast('Valor inválido.'); t.value = t.defaultValue; return; }
    S.plan.settings[key] = key === 'propostoPct' ? v / 100 : v;
    t.value = key === 'propostoPct' ? String(+v.toFixed(2)).replace('.', ',') + '%' : (key === 'metaInvAno' && v === 0 ? '' : nf.format(v));
    touch('plan'); renderLater();
    return;
  }
  if (t.matches('[data-cart="mes"]')) { S.cart.mes = +t.value; renderLater(); return; }
  if (t.matches('[data-cart="aporte"]')) {
    const v = E.parseValor(t.value);
    if (Number.isNaN(v) || v < 0) { toast('Valor de aporte inválido.'); t.value = nf.format(cartModel().aporte); return; }
    S.cart.aporte = v; t.value = nf.format(v); renderLater();
  }
}

let filterT = null;
function onInput(e) {
  const t = e.target;
  if (t.matches && t.matches('[data-filter]')) {
    S.filter[t.dataset.filter] = t.value;
    clearTimeout(filterT);
    filterT = setTimeout(() => {
      const pos = t.selectionStart; render();
      const n = $(`[data-filter="${t.dataset.filter}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* ignora */ } }
    }, 160);
  }
}

function onKey(e) {
  const t = e.target;
  if (!(t.matches && t.matches('td.ed')) || t.classList.contains('editing')) return;
  const ri = +t.dataset.ri; const m = +t.dataset.m;
  const go = (dir) => { const n = neighbor(ri, m, dir); if (n) { const c = findCell(n.ri, n.m); if (c) c.focus(); } };
  switch (e.key) {
    case 'Enter': case 'F2': e.preventDefault(); startEdit(t); return;
    case 'ArrowRight': e.preventDefault(); go('right'); return;
    case 'ArrowLeft': e.preventDefault(); go('left'); return;
    case 'ArrowDown': e.preventDefault(); go('down'); return;
    case 'ArrowUp': e.preventDefault(); go('up'); return;
    case 'Delete': case 'Backspace': { e.preventDefault(); const kind = applyCell(t.dataset, 0, true); touch(kind); S.pendingFocus = { ri, m }; render(); return; }
    default:
      if (!e.ctrlKey && !e.metaKey && !e.altKey && /^[0-9,.\-=+]$/.test(e.key)) { e.preventDefault(); startEdit(t, e.key); }
  }
}

let resizeT = null;
function bind() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  document.addEventListener('submit', onSubmit);
  $('#modal').addEventListener('close', () => { if (S.needsRender) render(); if (S.adminOpen) renderAdmin(); });
  $('#admin').addEventListener('close', () => { S.adminOpen = false; if (S.needsRender) render(); });
  $('#admin').addEventListener('click', (e) => { if (e.target === $('#admin')) closeAdmin(); });
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(drawCharts, 150); });
  document.addEventListener('focusout', () => { if (S.needsRender) setTimeout(() => { if (S.needsRender && !isEditing() && !isTyping()) render(); }, 80); });
  window.addEventListener('pagehide', () => { flush(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
}

async function init() {
  applyTheme(lsGet('fluxo:theme'));
  bind();
  render();
  let db = null; let user = null;
  try {
    if (IN_PLATFORM) [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
  } catch (e) { db = null; }
  let id = null;
  try { id = user && user.id ? await user.id() : null; } catch (e) { id = null; }
  try { S.owner = !!(user && user.isOwner && (await user.isOwner())); } catch (e) { S.owner = false; }
  if (db && id) { S.db = db; S.uid = id; S.mode = 'cloud'; subscribe(); }
  else { S.mode = 'local'; loadLocal(); render(); }
  if (IN_PLATFORM) {
    window.claude.use('sample').then((x) => { S.sample = x; if (S.screen === 'app' && S.view === 'geral' && S.plan) render({ soft: true }); }).catch(() => {});
    window.claude.use('downloads').then((x) => { S.downloads = x; if (S.adminOpen) renderAdmin(); }).catch(() => {});
  }
}

window.__fluxo = { S, E, CONFIG, render };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

})();

</script>
