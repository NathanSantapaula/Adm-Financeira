<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Financial planning — Nathan Santapaula</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap">
<style>
:root {
  --bg: #EEF2EC;
  --surface: #F8FAF6;
  --surface-2: #E8EEE5;
  --surface-3: #DCE5D8;
  --line: #D2DACF;
  --line-2: #BFCABB;
  --ink: #1D2B24;
  --ink-2: #4B5C52;
  --ink-3: #6F8076;
  --invest: #0E6F52;
  --on-invest: #FFFFFF;
  --invest-2: #7CC9A8;
  --spend: #3347B0;
  --meta: #B9820B;
  --neg: #BE2F45;
  --neg-soft: #F7E1E5;
  --warn-soft: #F6ECCB;
  --cur: rgba(14, 111, 82, 0.075);
  --side: #14281F;
  --side-ink: #DCE8DF;
  --side-ink-2: #9DB2A4;
  --side-hover: rgba(255, 255, 255, 0.07);
  --side-accent: #5ADBA8;
  --shadow: 0 18px 50px rgba(16, 36, 26, 0.22);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1511;
    --surface: #131F19;
    --surface-2: #1A2A22;
    --surface-3: #223529;
    --line: #25382E;
    --line-2: #32483C;
    --ink: #E4EEE7;
    --ink-2: #A5B7AC;
    --ink-3: #7F9387;
    --invest: #4FD1A1;
    --on-invest: #072117;
    --invest-2: #2C8A69;
    --spend: #8EA1FF;
    --meta: #E5B53F;
    --neg: #FF8397;
    --neg-soft: #3A1E26;
    --warn-soft: #3A3318;
    --cur: rgba(79, 209, 161, 0.08);
    --side: #09100D;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
  }
}
:root[data-theme="dark"] {
  --bg: #0D1511;
  --surface: #131F19;
  --surface-2: #1A2A22;
  --surface-3: #223529;
  --line: #25382E;
  --line-2: #32483C;
  --ink: #E4EEE7;
  --ink-2: #A5B7AC;
  --ink-3: #7F9387;
  --invest: #4FD1A1;
  --on-invest: #072117;
  --invest-2: #2C8A69;
  --spend: #8EA1FF;
  --meta: #E5B53F;
  --neg: #FF8397;
  --neg-soft: #3A1E26;
  --warn-soft: #3A3318;
  --cur: rgba(79, 209, 161, 0.08);
  --side: #09100D;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.55);
}

*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; min-height: 100%; display: flex; flex-direction: column;
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--f-body);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--invest); outline-offset: 2px; }

.app { flex: 1; display: grid; grid-template-columns: 236px minmax(0, 1fr); }

/* ---------- Barra lateral ---------- */
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  background: var(--side); color: var(--side-ink);
  display: flex; flex-direction: column; padding: 22px 14px 16px;
}
.brand { display: flex; align-items: center; gap: 11px; padding: 0 8px 22px; }
.bname { font: 700 22px/1 var(--f-display); letter-spacing: -0.02em; }
.bsub { font-size: 12px; color: var(--side-ink-2); margin-top: 4px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 10px 12px; border: 0; border-radius: 10px; background: transparent;
  color: var(--side-ink); font-weight: 500; font-size: 14.5px; transition: background .15s;
}
.nav button:hover { background: var(--side-hover); }
.nav button[aria-current="page"] { background: var(--side-hover); box-shadow: inset 3px 0 0 var(--side-accent); font-weight: 600; }
.nav svg { width: 19px; height: 19px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: .9; }
.side-foot { margin-top: auto; padding: 14px 8px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); display: grid; gap: 10px; }
.side-foot label { display: grid; gap: 4px; font-size: 12.5px; color: var(--side-ink-2); }
.side-foot select {
  width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.18);
  background: rgba(255, 255, 255, 0.06); color: var(--side-ink); font-weight: 600;
}
.side-foot select option { color: #1D2B24; }
.save { font-size: 12.5px; color: var(--side-ink-2); min-height: 18px; display: flex; align-items: center; gap: 7px; }
.save::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--side-ink-2); opacity: .6; }
.save[data-s="saved"]::before { background: var(--side-accent); opacity: 1; }
.save[data-s="error"]::before { background: #FF8397; opacity: 1; }
.save[data-s="saving"]::before, .save[data-s="pending"]::before { background: #E5B53F; opacity: 1; }
.save:empty { display: none; }

/* ---------- Conteúdo ---------- */
.main { padding: 30px clamp(16px, 3.2vw, 44px) 56px; min-width: 0; }
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 18px; }
h2.title { margin: 0; font: 650 28px/1.12 var(--f-display); letter-spacing: -0.02em; }
.sub { margin: 6px 0 0; color: var(--ink-2); max-width: 62ch; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.lede {
  margin: 0; max-width: 34ch; font: 600 clamp(26px, 3.4vw, 38px)/1.16 var(--f-display); letter-spacing: -0.022em;
  text-wrap: balance;
}
.lede u { text-decoration-thickness: 3px; text-underline-offset: 6px; }
.lede .u-spend { text-decoration-color: var(--spend); }
.lede .u-invest { text-decoration-color: var(--invest); }
.split { display: flex; gap: 3px; height: 16px; margin: 22px 0 8px; max-width: 760px; }
.split i { display: block; height: 100%; min-width: 0; }
.split .s-spend { background: var(--spend); border-radius: 8px 3px 3px 8px; }
.split .s-invest { background: var(--invest); border-radius: 3px 8px 8px 3px; flex: 1; }
.split.empty i { background: var(--surface-3); flex: 1; border-radius: 8px; }
.split-l { display: flex; justify-content: space-between; max-width: 760px; font-size: 13px; color: var(--ink-2); gap: 12px; }
.split-l b { color: var(--ink); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 26px 0 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stat { padding: 16px 20px 16px 0; }
.stat + .stat { padding-left: 20px; border-left: 1px solid var(--line); }
.stat .k { font-size: 13px; color: var(--ink-2); }
.stat .v { font: 650 26px/1.2 var(--f-display); letter-spacing: -0.015em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .n { font-size: 12.5px; color: var(--ink-3); margin-top: 2px; }
.bar { height: 6px; background: var(--surface-3); border-radius: 3px; margin-top: 9px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--invest); border-radius: 3px; }
@media (max-width: 720px) {
  .stat, .stat + .stat { padding: 14px 0; border-left: 0; }
  .stat + .stat { border-top: 1px solid var(--line); }
}

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 16px; margin-bottom: 22px; }
.chart-p { padding: 16px 16px 8px; position: relative; }
.chart-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
.chart-h h3 { margin: 0; font: 600 16.5px/1.2 var(--f-display); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--ink-2); flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.legend i.mk { height: 3px; width: 14px; border-radius: 2px; }
.chart { width: 100%; height: 250px; }
.chart svg { display: block; overflow: visible; }
.chart text { font-family: var(--f-body); font-size: 11.5px; fill: var(--ink-3); }
.chart .cur-l { fill: var(--ink); font-weight: 700; }
.tip {
  position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: var(--bg);
  padding: 9px 11px; border-radius: 9px; font-size: 12.5px; line-height: 1.45; box-shadow: var(--shadow); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.tip b { font-weight: 650; }

.sec-h { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 26px 0 10px; flex-wrap: wrap; }
.sec-h h3 { margin: 0; font: 600 19px/1.2 var(--f-display); letter-spacing: -0.01em; }
.sec-h p { margin: 3px 0 0; color: var(--ink-2); font-size: 13.5px; }

/* ---------- Tabelas ---------- */
.tablewrap { overflow: auto; max-height: min(72vh, 860px); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.grid { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1200px; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.grid th, .grid td { height: 35px; padding: 0 10px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--rowbg, transparent); }
.grid thead th { position: sticky; top: 0; z-index: 3; background: var(--surface-2); text-align: right; font-weight: 600; color: var(--ink-2); font-size: 13px; }
.grid thead th.lab { text-align: left; z-index: 5; }
.grid th.tot, .grid td.tot { border-left: 1px solid var(--line); font-weight: 600; }
.grid .lab { position: sticky; left: 0; z-index: 2; text-align: left; min-width: 250px; max-width: 330px; width: 290px; background: var(--rowbg, var(--surface)); border-right: 1px solid var(--line); overflow: hidden; text-overflow: ellipsis; }
.grid td.num { text-align: right; position: relative; }
.grid td.z { color: var(--ink-3); }
.grid td.neg { color: var(--neg); }
.grid th.cur, .grid td.cur { box-shadow: inset 0 0 0 999px var(--cur); }
.grid th.cur { color: var(--ink); font-weight: 700; }
.grid tbody tr:last-child td { border-bottom: 0; }
.grid .in { display: flex; align-items: center; gap: 6px; padding-left: calc(var(--d, 0) * 18px); min-width: 0; }
.grid .in > span, .grid .in > .lnk { overflow: hidden; text-overflow: ellipsis; }
.grid td.ed { cursor: cell; }
.grid td.ed:hover { background: var(--surface-2); }
.grid td.ed:focus { outline: 2px solid var(--invest); outline-offset: -2px; background: var(--surface); }
.grid td.editing { padding: 0; }
.cell-input { width: 100%; height: 100%; min-height: 34px; border: 0; background: var(--surface); text-align: right; padding: 0 10px; outline: 2px solid var(--invest); outline-offset: -2px; font: inherit; font-variant-numeric: tabular-nums; color: var(--ink); }
.cell-input.bad { outline-color: var(--neg); background: var(--neg-soft); }

.r-g { --rowbg: var(--surface); font-weight: 600; }
.r-g.d0 { --rowbg: var(--surface-3); font-weight: 650; }
.r-g.d1 { --rowbg: var(--surface-2); }
.r-gh { --rowbg: var(--surface-2); font-weight: 650; }
.r-gh td { color: var(--ink-2); font-size: 13px; }
.r-total { --rowbg: var(--surface-2); font-weight: 700; }
.r-total td { border-top: 2px solid var(--line-2); }
.r-ratio { font-size: 13px; color: var(--ink-2); }
.r-note td { color: var(--ink-3); font-size: 13px; }
.r-add td { height: 32px; }
.chev { width: 22px; height: 22px; flex: none; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: var(--ink-2); padding: 0; }
.chev:hover { background: var(--line); }
.chev svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; transition: transform .15s; }
.chev[aria-expanded="true"] svg { transform: rotate(90deg); }
.chev-sp { width: 22px; flex: none; }
.lnk { border: 0; background: transparent; padding: 0; text-align: left; color: inherit; font: inherit; font-weight: inherit; }
.lnk:hover { text-decoration: underline; text-decoration-color: var(--ink-3); text-underline-offset: 3px; }
.lnk.add { color: var(--invest); font-weight: 600; }
.lnk.lanc { color: var(--ink-2); font-weight: 400; }
.grid td.empty { background: var(--rowbg, transparent); }

.btn {
  display: inline-flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 10px;
  border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; font-size: 14px; transition: background .15s;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--invest); color: var(--on-invest); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); background: var(--invest); }
.btn.danger { color: var(--neg); border-color: var(--neg); background: transparent; }
.btn.danger:hover { background: var(--neg-soft); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .55; cursor: default; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; }
.search { padding: 8px 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); min-width: 190px; }

/* ---------- Painéis e estados ---------- */
.reading { padding: 18px 20px; }
.reading p { margin: 0 0 10px; max-width: 72ch; }
.reading p:last-child { margin-bottom: 0; }
.reading .cap { color: var(--ink-3); font-size: 12.5px; margin-top: 12px; }
.notice { margin: 0 0 18px; padding: 11px 14px; border-radius: 10px; background: var(--warn-soft); font-size: 13.5px; }
.empty-state { max-width: 560px; margin: 8vh auto 0; text-align: left; }
.empty-state h2 { font: 650 30px/1.15 var(--f-display); letter-spacing: -0.02em; margin: 0 0 10px; }
.empty-state p { color: var(--ink-2); margin: 0 0 18px; }
.loading { padding: 12vh 0; color: var(--ink-2); text-align: center; }

.settings { display: grid; gap: 18px; max-width: 760px; }
.set-block { padding: 20px 22px; }
.set-block h3 { margin: 0 0 4px; font: 600 17px/1.25 var(--f-display); }
.set-block > p { margin: 0 0 14px; color: var(--ink-2); font-size: 13.5px; }
.field-row { display: grid; grid-template-columns: minmax(0, 1fr) 150px; gap: 14px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.field-row:first-of-type { border-top: 0; }
.field-row small { display: block; color: var(--ink-3); font-size: 12.5px; }
.in-s {
  width: 100%; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface);
  text-align: right; font-variant-numeric: tabular-nums;
}
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

/* ---------- Modal ---------- */
dialog { border: 0; border-radius: 16px; padding: 0; background: var(--surface); color: var(--ink); box-shadow: var(--shadow); width: min(500px, calc(100vw - 28px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(8, 18, 13, 0.55); }
.mform { display: flex; flex-direction: column; max-height: inherit; }
.mform header { padding: 20px 22px 4px; }
.mform h3 { margin: 0; font: 650 20px/1.2 var(--f-display); letter-spacing: -0.01em; }
.mbody { padding: 12px 22px 6px; overflow: auto; display: grid; gap: 13px; }
.mform footer { display: flex; gap: 8px; align-items: center; padding: 14px 22px 20px; }
.mform footer .sp { flex: 1; }
.fld { display: grid; gap: 5px; font-size: 13.5px; font-weight: 600; }
.fld span small { font-weight: 400; color: var(--ink-3); }
.fld input, .fld select { width: 100%; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--bg); font-weight: 400; }
.fld-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.merr { color: var(--neg); font-size: 13px; min-height: 0; }
.mmsg { color: var(--ink-2); margin: 0; }

.toast {
  position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s; z-index: 80; max-width: calc(100vw - 32px);
}
.toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- Celular ---------- */
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; height: auto; z-index: 40; flex-direction: row;
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(255, 255, 255, 0.1);
  }
  .brand, .side-foot { display: none; }
  .nav { flex-direction: row; width: 100%; justify-content: space-between; }
  .nav button { flex-direction: column; gap: 3px; padding: 6px 2px; font-size: 11px; text-align: center; justify-content: center; flex: 1; min-width: 0; }
  .nav button span { overflow: hidden; text-overflow: ellipsis; max-width: 100%; white-space: nowrap; }
  .nav button[aria-current="page"] { box-shadow: inset 0 3px 0 var(--side-accent); }
  .main { padding: 20px 14px calc(96px + env(safe-area-inset-bottom, 0px)); }
  .grid .lab { min-width: 168px; width: 168px; max-width: 168px; }
  .mob-bar { display: flex !important; }
}
.mob-bar { display: none; gap: 8px; align-items: center; margin-bottom: 14px; }
.mob-bar select { padding: 7px 10px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface); font-weight: 600; }
.mob-bar .save { color: var(--ink-2); margin-left: auto; }
.mob-bar .save::before { background: var(--ink-3); }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ================= Financial planning: telas novas ================= */
body[data-screen]:not([data-screen="app"]) .app { grid-template-columns: minmax(0, 1fr); }
body[data-screen]:not([data-screen="app"]) .side { display: none; }
body[data-screen="landing"] .main { padding: 0; }
body[data-screen="signup"] .main, body[data-screen="checkout"] .main, body[data-screen="onboarding"] .main { padding-top: 22px; }
.btn.lg { padding: 12px 20px; font-size: 15.5px; border-radius: 12px; }
.lnk.strong { font-weight: 600; color: var(--invest); text-decoration: underline; text-underline-offset: 3px; }
.cap { color: var(--ink-3); font-size: 12.5px; margin: 8px 0 0; }
.cap.center { text-align: center; margin-top: 16px; }
.cap.disc { margin-top: 22px; max-width: 70ch; }
.mmsg { margin: 0 0 8px; }
.in-s.left { text-align: left; }

/* navegação: bloqueio, conta e assessor */
.nav em.lk { margin-left: auto; display: inline-grid; opacity: .75; font-style: normal; }
.nav em.lk svg { width: 14px; height: 14px; }
.acct { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: var(--side-ink); text-align: left; }
.acct:hover { background: var(--side-hover); }
.acct .av { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--side-accent); color: #14281F; font: 700 15px var(--f-display); }
.acct-t { min-width: 0; flex: 1; display: grid; line-height: 1.25; }
.acct-t b { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct-t small { font-size: 12px; color: var(--side-ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.acct svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; opacity: .8; }
.advisor { padding: 12px; border-radius: 12px; background: rgba(90,219,168,.1); display: grid; gap: 9px; }
.adv-t { font-size: 12.5px; color: var(--side-ink-2); display: grid; }
.adv-t b { color: var(--side-ink); font-size: 14px; font-weight: 600; }
.advisor .btn { background: transparent; color: var(--side-ink); border-color: rgba(255,255,255,.22); justify-content: center; }
.advisor .btn:hover { background: var(--side-hover); }
.notice .lnk.strong { margin-left: 6px; }

/* página inicial */
.land { max-width: 1180px; margin: 0 auto; padding: 0 clamp(16px, 3.4vw, 40px) 40px; }
.l-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 18px 0; flex-wrap: wrap; }
.l-brand { display: flex; align-items: center; gap: 11px; }
.l-brand .bsub { color: var(--ink-2); }
.l-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.l-hero { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); gap: clamp(24px, 4vw, 56px); align-items: center; padding: clamp(24px, 6vw, 72px) 0 clamp(28px, 5vw, 56px); }
.l-hero .lede { max-width: 17em; font-size: clamp(32px, 4.6vw, 52px); }
.l-sub { font-size: 17px; color: var(--ink-2); max-width: 46ch; margin: 18px 0 24px; }
.hero-chart { padding-bottom: 12px; }
.hero-chart .cap { padding: 0 2px; }
.l-sec { padding: clamp(28px, 5vw, 56px) 0; border-top: 1px solid var(--line); }
.l-h2 { margin: 0 0 22px; font: 650 clamp(24px, 3vw, 32px)/1.15 var(--f-display); letter-spacing: -0.02em; }
.l-cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
.l-cols h3 { margin: 0 0 6px; font: 600 17px/1.25 var(--f-display); }
.l-cols p { margin: 0; color: var(--ink-2); font-size: 14.5px; }
.plans { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; max-width: 920px; }
.plan { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; }
.plan.featured { border: 2px solid var(--invest); }
.plan h3 { margin: 0; font: 650 24px/1.2 var(--f-display); }
.plan-d { margin: 4px 0 0; color: var(--ink-2); }
.price { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 14px 0 16px; font-family: var(--f-display); font-variant-numeric: tabular-nums; }
.price b { font-size: 40px; line-height: 1; font-weight: 700; letter-spacing: -0.02em; }
.price .de, .price .por { color: var(--ink-3); font-size: 15px; font-family: var(--f-body); }
.plan ul { margin: 0 0 22px; padding: 0 0 0 18px; display: grid; gap: 8px; color: var(--ink); flex: 1; }
.plan li::marker { color: var(--invest); }
.l-about { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: clamp(20px, 4vw, 48px); align-items: start; }
.l-about p { max-width: 58ch; color: var(--ink-2); }
.about-c { padding: 22px; }
.about-c h3 { margin: 0 0 12px; font: 600 18px var(--f-display); }
.l-foot { border-top: 1px solid var(--line); padding-top: 22px; color: var(--ink-3); font-size: 13px; }
.l-foot p { margin: 0 0 8px; max-width: 80ch; }

/* cadastro, checkout e onboarding */
.auth { max-width: 600px; margin: 0 auto; padding: 0 0 40px; }
.auth.wide { max-width: 1080px; }
.auth .back { margin-bottom: 8px; }
.auth-card { padding: clamp(20px, 4vw, 34px); }
.auth-card h2, .co-sum h2 { margin: 0 0 6px; font: 650 28px/1.15 var(--f-display); letter-spacing: -0.02em; }
.auth-card form { display: grid; gap: 14px; margin-top: 16px; }
.plan-pick { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; }
.plan-pick legend { font-size: 13.5px; font-weight: 600; padding: 0; margin-bottom: 6px; }
.pick { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 13px 14px; border: 1px solid var(--line-2); border-radius: 12px; background: var(--bg); cursor: pointer; }
.pick:has(input:checked) { border-color: var(--invest); box-shadow: inset 0 0 0 1px var(--invest); }
.pick input { accent-color: var(--invest); width: 18px; height: 18px; }
.pick span { display: grid; min-width: 0; }
.pick small { color: var(--ink-2); font-size: 13px; font-weight: 400; }
.pick em { font-style: normal; font-weight: 700; font-family: var(--f-display); white-space: nowrap; }
.pick em s { color: var(--ink-3); font-weight: 400; font-size: 13px; margin-right: 4px; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.chk input { accent-color: var(--invest); width: 18px; height: 18px; margin-top: 2px; flex: none; }
.chk span { display: grid; }
.chk small { color: var(--ink-2); font-size: 13px; font-weight: 400; }
.abas { display: grid; gap: 10px; }
.aba { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.ob-steps { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
.ob-steps span { padding: 5px 11px; border-radius: 999px; background: var(--surface-2); color: var(--ink-3); font-size: 13px; font-weight: 600; }
.ob-steps span.on { background: var(--invest); color: var(--on-invest); }
.ob-steps span.ok { background: var(--surface-3); color: var(--ink); }
.fld small { font-weight: 400; color: var(--ink-3); }
.co-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 20px; align-items: start; }
.co-sum { padding: 26px; }
.co-sum ul { padding-left: 18px; display: grid; gap: 8px; margin: 0; }
.co-sum li::marker { color: var(--invest); }
.co-steps { display: grid; gap: 14px; }
.step { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; }
.step h3 { margin: 0 0 8px; font: 600 17px/1.25 var(--f-display); display: flex; align-items: center; gap: 10px; }
.step h3 span { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--surface-3); font-size: 13px; }
.step.done { border-color: var(--invest); }
.act-row { display: flex; gap: 8px; }
.act-row .in-s { text-align: left; letter-spacing: .08em; text-transform: uppercase; }

/* painel administrativo lateral */
dialog.drawer { margin: 0 0 0 auto; width: min(560px, 100vw); max-width: 100vw; height: 100%; max-height: 100%; border-radius: 18px 0 0 18px; display: none; flex-direction: column; overflow: hidden; }
dialog.drawer[open] { display: flex; animation: drin .2s ease-out; }
dialog.drawer::backdrop { background: rgba(8, 18, 13, 0.45); }
@keyframes drin { from { transform: translateX(36px); opacity: .4; } }
.dr-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: calc(18px + env(safe-area-inset-top, 0px)) 20px 10px 22px; }
.dr-head h2 { margin: 0; font: 650 22px/1.2 var(--f-display); letter-spacing: -0.01em; }
.dr-head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13.5px; }
.dr-tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.dr-tabs button { border: 0; background: transparent; padding: 10px 12px; font-weight: 600; font-size: 14px; color: var(--ink-2); border-bottom: 3px solid transparent; white-space: nowrap; }
.dr-tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--invest); }
.dr-body { flex: 1; overflow: auto; padding: 8px 22px calc(28px + env(safe-area-inset-bottom, 0px)); }
.dr-sec { padding: 16px 0; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
.dr-sec:last-child { border-bottom: 0; }
.dr-sec h3 { margin: 0; font: 600 17px/1.25 var(--f-display); }
.dr-sec .field-row { grid-template-columns: minmax(0, 1fr) 140px; }
.how { font-size: 13.5px; color: var(--ink-2); }
.how summary { cursor: pointer; font-weight: 600; color: var(--ink); }
.how ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.plan-pick.tight { gap: 6px; }
.imp-prev { padding: 14px 16px; display: grid; gap: 8px; }
.imp-prev h4 { margin: 0; font: 600 15px var(--f-display); word-break: break-all; }
.sum { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.warns { margin: 0; padding-left: 18px; font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
.plan-badge { display: inline-block; align-self: start; padding: 5px 12px; border-radius: 999px; background: var(--surface-3); font-weight: 600; font-size: 13.5px; }
.plan-badge.on { background: var(--invest); color: var(--on-invest); }
.plan-badge.wait { background: var(--warn-soft); }

/* carteira */
.locked { display: flex; gap: 18px; align-items: flex-start; padding: 26px; border: 1px dashed var(--line-2); border-radius: 16px; background: var(--surface); max-width: 760px; }
.lock-ic { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--surface-3); }
.lock-ic svg { width: 22px; height: 22px; stroke: var(--ink); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.locked h3 { margin: 0 0 6px; font: 600 19px/1.25 var(--f-display); }
.locked p { margin: 0 0 14px; color: var(--ink-2); max-width: 56ch; }
.chip { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 600; background: var(--surface-3); }
.chip.ok { background: var(--invest); color: var(--on-invest); }
.chip.warn { background: var(--warn-soft); }
.cart-top { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 0; margin-bottom: 4px; }
.cart-in { padding: 18px 20px; display: grid; gap: 12px; align-content: start; border-right: 1px solid var(--line); }
.cart-out { padding: 18px 22px; }
.cart-out h3 { margin: 0 0 10px; font: 600 18px/1.25 var(--f-display); }
.alloc { list-style: none; margin: 0 0 6px; padding: 0; display: grid; }
.alloc li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 16px; align-items: baseline; padding: 9px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.alloc li:last-child { border-bottom: 0; }
.a-n { font-weight: 600; display: grid; }
.a-n small { font-weight: 400; color: var(--ink-3); font-size: 12.5px; }
.a-p { color: var(--ink-3); font-size: 13px; }
.a-v { font: 650 18px var(--f-display); color: var(--invest); }
.cart-out .btn-row { margin-top: 10px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.mini th, table.mini td { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: left; }
table.mini tr:last-child td { border-bottom: 0; }
table.mini .num, table.mini th.num { text-align: right; }
table.mini th { color: var(--ink-2); font-weight: 600; font-size: 13px; }
.meter { position: relative; height: 8px; min-width: 120px; background: var(--surface-3); border-radius: 4px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--invest); border-radius: 4px; }
.meter b { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink); border-radius: 1px; }
.grid.grid-cart { min-width: 860px; }
.grid-cart thead th { white-space: normal; line-height: 1.2; padding-top: 6px; padding-bottom: 6px; }
.grid .under, table.mini .under { color: var(--invest); font-weight: 600; }
.grid .over, table.mini .over { color: var(--meta); font-weight: 600; }
.grid td.auto { font-style: italic; color: var(--ink-2); }
.grid td.sug.pos { color: var(--invest); font-weight: 700; }

@media (max-width: 900px) {
  .l-hero { grid-template-columns: minmax(0, 1fr); }
  .l-cols { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .l-about, .co-grid, .cart-top { grid-template-columns: minmax(0, 1fr); }
  .cart-in { border-right: 0; border-bottom: 1px solid var(--line); }
  dialog.drawer { border-radius: 0; }
  body[data-screen="landing"] .main, body[data-screen="signup"] .main, body[data-screen="checkout"] .main, body[data-screen="onboarding"] .main { padding-bottom: 28px; }
}
@media (max-width: 640px) {
  .plans, .l-cols { grid-template-columns: minmax(0, 1fr); }
  .hide-s { display: none; }
  .act-row { flex-wrap: wrap; }
  .locked { flex-direction: column; }
  .mob-bar .btn.ghost { padding: 6px 8px; }
}

/* ajustes finais */
a.btn { text-decoration: none; color: var(--ink); }
a.btn.primary { color: var(--on-invest); }
.plan ul { align-content: start; }
.l-hero .lede { font-size: clamp(30px, 3.9vw, 46px); }
.co-steps > .btn { justify-self: start; }
@media (max-width: 900px) { .nav button span { white-space: normal; line-height: 1.1; } }

</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side"></aside>
  <main class="main"><div id="banner"></div><div id="view"></div></main>
</div>
<dialog id="modal"></dialog>
<dialog id="admin" class="drawer" aria-label="Painel administrativo"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip" hidden></div>
<script>
/* Fluxo — motor de cálculo (puro, sem DOM). Reproduz as fórmulas da planilha "Administração Financeira". */
(function (root) {
  'use strict';
  const MES = ['Jan', 'Fev', 'Mar', 'Abr', 'Mai', 'Jun', 'Jul', 'Ago', 'Set', 'Out', 'Nov', 'Dez'];
  const z = () => new Array(12).fill(0);
  const add = (a, b) => a.map((x, i) => x + (+b[i] || 0));
  const sub = (a, b) => a.map((x, i) => x - (+b[i] || 0));
  const sum = (a) => a.reduce((s, x) => s + x, 0);
  const r2 = (x) => Math.round(x * 100) / 100;

  // Taxonomia sugerida (estrutura das abas INVESTIMENTOS / PROVENTOS)
  const TAXONOMIA = {
    'RENDA FIXA': { "CDB's": {}, 'Tesouro Direto': {} },
    'BOLSA DE VALORES': {
      'Ações BR': { Financeiro: [], Utilities: [], Commodities: [] },
      'Ações EUA': {},
      Criptoativos: {},
      "ETF's": {},
      'Fundos Imobiliários': {
        'Fundo de Papel (CRI)': ['High Yield', 'High Grade'],
        'Fundo de Tijolo': ['Shoppings Centers', 'Lajes Corporativas', 'Galpões Logísticos'],
        'Híbridos': [],
        FoFs: [],
      },
    },
  };

  const ASSET_LEVELS = ['tipo', 'classe', 'grupo', 'subgrupo'];

  function compute(plan) {
    const S = plan.settings || {};
    const pct = S.propostoPct == null ? 0.12 : +S.propostoPct;
    const metaBase = S.metaBase == null ? 2000 : +S.metaBase;

    let rendaFixa = z(), rendaExtra = z();
    for (const r of plan.rendas) {
      if (r.cat === 'FIXA') rendaFixa = add(rendaFixa, r.v); else rendaExtra = add(rendaExtra, r.v);
    }

    let dividendos = z(), rentab = z(), aplicado = z();
    for (const a of plan.ativos) {
      aplicado = add(aplicado, a.ap);
      if (a.tipo === 'RENDA FIXA') rentab = add(rentab, a.pr); else dividendos = add(dividendos, a.pr);
    }

    const outros = plan.outros.map((x) => +x || 0);
    const receita = add(add(add(rendaFixa, dividendos), rendaExtra), outros);

    let despVar = z(), despFix = z();
    for (const d of plan.despesas) {
      const v = lancMeses(d);
      if (d.cat === 'FIXA') despFix = add(despFix, v); else despVar = add(despVar, v);
    }
    const despesas = add(despVar, despFix);
    const investAlocado = sub(receita, despesas);

    const proposto = rendaFixa.map((x) => x * pct);
    const difProposto = sub(proposto, despesas);
    const pctReceita = despesas.map((d, i) => (receita[i] > 0 ? d / receita[i] : null));

    const aportes = sub(aplicado, dividendos);
    const diferenca = sub(investAlocado, aportes);
    const meta = dividendos.map((d) => metaBase + d);
    const faturamento = add(dividendos, rentab);

    const out = { rendaFixa, rendaExtra, dividendos, rentab, outros, receita, despVar, despFix, despesas, investAlocado,
      proposto, difProposto, pctReceita, aplicado, aportes, diferenca, meta, faturamento };
    const T = {};
    for (const k of Object.keys(out)) if (k !== 'pctReceita') T[k] = sum(out[k]);
    T.pctReceita = T.receita > 0 ? T.despesas / T.receita : null;
    out.T = T;
    const metaAnoCfg = +S.metaInvAno || 0;
    out.metaAno = metaAnoCfg > 0 ? metaAnoCfg : T.meta;
    out.metaAnoDefinida = metaAnoCfg > 0;
    return out;
  }

  function lancMeses(d) {
    const v = z();
    for (const l of d.lanc) v[l.m] += +l.v || 0;
    return v;
  }

  // Árvore hierárquica de ativos: tipo > classe > grupo > subgrupo > ativo
  function buildAssetTree(ativos, field) {
    const root = { children: [], map: new Map() };
    for (const a of ativos) {
      let node = root, key = '';
      for (const lv of ASSET_LEVELS) {
        const lab = a[lv];
        if (!lab) continue;
        key += '/' + lab;
        let ch = node.map.get(lab);
        if (!ch) {
          ch = { key, label: lab, level: lv, depth: ASSET_LEVELS.indexOf(lv), children: [], map: new Map(), v: z() };
          node.map.set(lab, ch);
          node.children.push(ch);
        }
        ch.v = add(ch.v, a[field]);
        node = ch;
      }
      node.children.push({ leaf: true, key: key + '/#' + a.id, label: a.nome, asset: a, v: a[field] });
    }
    return root.children;
  }

  // Aceita "1.234,56", "1234.56", "-10", "=100,50+20" (soma/subtração simples, como nas fórmulas da planilha)
  function parseValor(str) {
    if (typeof str === 'number') return isFinite(str) ? str : NaN;
    let s = String(str == null ? '' : str).replace(/R\$|\s/g, '').replace(/^=/, '');
    if (s === '' || s === '-') return 0;
    const parts = s.split(/(?=[+-])/).filter(Boolean);
    let total = 0;
    for (const p of parts) {
      let t = p;
      if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
      else if ((t.match(/\./g) || []).length > 1) t = t.replace(/\./g, '');
      const n = Number(t);
      if (!isFinite(n) || t === '' || t === '+' || t === '-') return NaN;
      total += n;
    }
    return r2(total);
  }

  /* ---------- utilitários ---------- */
  const norm = (s) => String(s == null ? '' : s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
  const MKEYS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  function monthIndex(s) {
    const n = norm(s);
    if (!n) return -1;
    const i = MKEYS.indexOf(n.slice(0, 3));
    if (i >= 0 && /^[a-z]/.test(n)) return i;
    const k = parseInt(n, 10);
    return k >= 1 && k <= 12 && /^\d+$/.test(n) ? k - 1 : -1;
  }
  const ativoKey = (a) => [norm(a.tipo), norm(a.classe), norm(a.grupo), norm(a.subgrupo), norm(a.nome)].join('|');

  /* ---------- SHA-256 (códigos de ativação) ---------- */
  const SHA = (() => {
    const K = []; const H0 = []; let n = 2;
    const isPrime = (x) => { for (let d = 2; d * d <= x; d++) if (x % d === 0) return false; return true; };
    while (K.length < 64) {
      if (isPrime(n)) { if (H0.length < 8) H0.push((Math.pow(n, 1 / 2) % 1) * 4294967296 | 0); K.push((Math.pow(n, 1 / 3) % 1) * 4294967296 | 0); }
      n++;
    }
    return { K, H0 };
  })();
  function sha256(msg) {
    const utf8 = unescape(encodeURIComponent(String(msg)));
    const bytes = []; for (let i = 0; i < utf8.length; i++) bytes.push(utf8.charCodeAt(i));
    const bitLen = bytes.length * 8;
    bytes.push(0x80); while (bytes.length % 64 !== 56) bytes.push(0);
    const hi = Math.floor(bitLen / 4294967296); const lo = bitLen >>> 0;
    [hi, lo].forEach((v) => { bytes.push((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255); });
    const h = SHA.H0.slice(); const w = new Array(64);
    const rotr = (x, c) => (x >>> c) | (x << (32 - c));
    for (let off = 0; off < bytes.length; off += 64) {
      for (let i = 0; i < 16; i++) w[i] = (bytes[off + 4 * i] << 24) | (bytes[off + 4 * i + 1] << 16) | (bytes[off + 4 * i + 2] << 8) | bytes[off + 4 * i + 3];
      for (let i = 16; i < 64; i++) {
        const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3);
        const s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
        w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
      }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const S1 = rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25);
        const ch = (e & f) ^ (~e & g);
        const t1 = (hh + S1 + ch + SHA.K[i] + w[i]) | 0;
        const S0 = rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22);
        const maj = (a & b) ^ (a & c) ^ (b & c);
        const t2 = (S0 + maj) | 0;
        hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
      }
      h[0] = (h[0] + a) | 0; h[1] = (h[1] + b) | 0; h[2] = (h[2] + c) | 0; h[3] = (h[3] + d) | 0;
      h[4] = (h[4] + e) | 0; h[5] = (h[5] + f) | 0; h[6] = (h[6] + g) | 0; h[7] = (h[7] + hh) | 0;
    }
    return h.map((x) => (x >>> 0).toString(16).padStart(8, '0')).join('');
  }
  const normCodigo = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  /* ---------- rebalanceamento por aportes (só compra, nunca vende) ---------- */
  function rebalance(items, aporte) {
    const n = items.length;
    const w = items.map((i) => Math.max(0, +i.w || 0));
    const v = items.map((i) => Math.max(0, +i.v || 0));
    const W = sum(w); const total = sum(v);
    const zero = { alloc: new Array(n).fill(0), W, total, T: total + Math.max(0, aporte) };
    if (!(aporte > 0) || W <= 0 || n === 0) return zero;
    const T = total + aporte;
    const need = w.map((x, i) => Math.max(0, (x / W) * T - v[i]));
    const N = sum(need);
    let raw;
    if (N <= 0) raw = w.map((x) => (aporte * x) / W);
    else if (N >= aporte) raw = need.map((x) => (aporte * x) / N);
    else raw = need.map((x, i) => x + ((aporte - N) * w[i]) / W);
    const cents = raw.map((x) => Math.floor(x * 100 + 1e-7));
    let left = Math.round(aporte * 100) - sum(cents);
    const order = raw.map((x, i) => [x * 100 - Math.floor(x * 100 + 1e-7), i]).sort((a, b) => b[0] - a[0]);
    for (let k = 0; left > 0 && order.length; k = (k + 1) % order.length) { cents[order[k][1]]++; left--; }
    return { alloc: cents.map((c) => c / 100), W, total, T };
  }

  const normTipo = (s) => {

  const sheetByName = (sheets, names) => sheets.find((s) => names.includes(norm(s.name)));
  function readTable(sheet, firstHeader) {

    if (hi < 0) return null;

  function monthCols(head, from) {

    return cols;
  }

  function parseImport(sheets) {

    const sr = sheetByName(sheets, ['rendas']);

      out.found.rendas = true; const cols = monthCols(tr.head, 3);
      tr.body.forEach(({ r, line }) => {
        const c = norm(r[0]); const where = `Rendas, linha ${line}`;
        const v = cols.map((ci) => cellNum(r[ci], avisos, where));

        const cat = c.includes('fixa') ? 'FIXA' : c.includes('extra') ? 'EXTRA' : null;

        const area = String(r[1]).trim(); const detalhe = String(r[2]).trim();

        out.rendas.push({ cat, area, detalhe, v });
      });
    } else if (sr) avisos.push('Aba Rendas encontrada, mas sem o cabeçalho “Categoria” na primeira coluna. Aba ignorada.');

    const sd = sheetByName(sheets, ['despesas', 'lancamentos']);

    out.counts = { rendas: out.rendas.length + (out.outros ? 1 : 0), lancamentos: out.desp.length, investimentos: out.inv.length, proventos: out.prov.length, carteira: out.cart.length };
    out.vazio = !Object.values(out.counts).some((n) => n > 0);

  }

  function applyImport(plan, carteira, parsed, mode, newId) {

    if (parsed.found.rendas) {
      if (replace) { plan.rendas.forEach((r) => { r.v = new Array(12).fill(0); }); plan.outros = new Array(12).fill(0); }
      parsed.rendas.forEach((x) => {

        if (!r) { r = { id: newId(), cat: x.cat, area: x.area, detalhe: x.detalhe, v: new Array(12).fill(0) }; plan.rendas.push(r); }
        r.v = x.v.slice(); res.rendas++;

      if (parsed.outros) { plan.outros = parsed.outros.slice(); res.rendas++; }
    }
    if (parsed.found.desp) {
      if (replace) plan.despesas.forEach((d) => { d.lanc = []; });
      parsed.desp.forEach((x) => {
        let d = plan.despesas.find((y) => y.cat === x.cat && norm(y.area) === norm(x.area) && norm(y.nome) === norm(x.nome));
        if (!d) { d = { id: newId(), cat: x.cat, area: x.area, nome: x.nome, lanc: [] }; plan.despesas.push(d); }
        if (d.lanc.some((l) => l.m === x.m && norm(l.d) === norm(x.d) && Math.abs(l.v - x.v) < 0.005)) { res.ignorados++; return; }
        d.lanc.push({ id: newId(), m: x.m, d: x.d, v: x.v }); res.lancamentos++;
      });
    }
    const upsertAtivo = (x) => {
      const k = ativoKey(x);
      let a = plan.ativos.find((y) => ativoKey(y) === k);
      if (!a) { a = { id: newId(), tipo: x.tipo, classe: x.classe, grupo: x.grupo || null, subgrupo: x.subgrupo || null, nome: x.nome, ap: new Array(12).fill(0), pr: new Array(12).fill(0) }; plan.ativos.push(a); res.ativos++; }
      return a;
    };
    if (replace && parsed.found.inv) plan.ativos.forEach((a) => { a.ap = new Array(12).fill(0); });
    if (replace && parsed.found.prov) plan.ativos.forEach((a) => { a.pr = new Array(12).fill(0); });
    parsed.inv.forEach((x) => { upsertAtivo(x).ap = x.v.slice(); });
    parsed.prov.forEach((x) => { upsertAtivo(x).pr = x.v.slice(); });
    if (parsed.found.cart) {

        let e = carteira.find((y) => y.k === k);

        e.alvo = x.alvo; e.valor = x.valor; e.preco = x.preco; res.carteira++;
      });
    }

let RI = 0;
let FIRST_ED = true;

const lsGet = (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } };

/* ---------- planos e perfil ---------- */
function hydrate(p) {
  const fix12 = (a) => { a = Array.isArray(a) ? a.slice(0, 12) : []; while (a.length < 12) a.push(0); return a.map((x) => +x || 0); };
  p.settings = Object.assign({ propostoPct: 0.12, metaBase: 2000, metaInvAno: 0 }, p.settings || {});
  p.outros = fix12(p.outros);
  p.rendas = (p.rendas || []).map((r) => Object.assign({}, r, { id: r.id || uid(), v: fix12(r.v) }));
  p.despesas = (p.despesas || []).map((d) => Object.assign({}, d, {
    id: d.id || uid(),
    lanc: (d.lanc || []).map((l) => Object.assign({}, l, { id: l.id || uid(), m: Math.min(11, Math.max(0, l.m | 0)), v: +l.v || 0 })),
  }));
  p.ativos = (p.ativos || []).map((a) => Object.assign({}, a, { id: a.id || uid(), grupo: a.grupo || null, subgrupo: a.subgrupo || null, ap: fix12(a.ap), pr: fix12(a.pr) }));
  p.year = p.year || S.year || NOW_Y;
  p.updatedAt = p.updatedAt || 0;
  return p;
}

function hydrateProfile(p) {
  let abas = Array.isArray(p.abas) ? p.abas.filter((k) => ABA_KEYS.includes(k)) : ABA_KEYS.slice();
  if (!abas.includes('geral')) abas.unshift('geral');
  p.abas = abas;
  p.carteira = Array.isArray(p.carteira) ? p.carteira.map((e) => ({ k: String(e.k), alvo: +e.alvo || 0, valor: e.valor == null ? null : +e.valor, preco: e.preco == null ? null : +e.preco })) : [];
  p.plano = p.plano === 'completo' ? 'completo' : 'gratis';
  p.cobranca = p.cobranca === 'aguardando' ? 'aguardando' : 'ativo';
  p.nome = p.nome || ''; p.email = p.email || ''; p.whatsapp = p.whatsapp || '';
  p.anoRef = (p.anoRef | 0) || NOW_Y;
  p.onboarded = !!p.onboarded;
  p.updatedAt = p.updatedAt || 0;
  return p;
}
const newProfile = (o) => hydrateProfile(Object.assign({ v: 1, nome: '', email: '', whatsapp: '', plano: 'gratis', cobranca: 'ativo', onboarded: false, criadoEm: Date.now(), updatedAt: Date.now() }, o || {}));

const hasFull = () => !!S.owner || !!(S.profile && S.profile.plano === 'completo' && S.profile.cobranca === 'ativo');
const gated = (key) => !!CONFIG.gates[key] && !hasFull();
const visibleTabs = () => (S.profile ? S.profile.abas : ABA_KEYS);

function blankPlan(year, base) {
  const p = { v: 1, year, settings: { propostoPct: 0.12, metaBase: 2000, metaInvAno: 0 }, outros: z12(), rendas: [], despesas: [], ativos: [], updatedAt: Date.now() };
  if (base) {
    p.settings = Object.assign({}, clone(base.settings));
    p.rendas = base.rendas.map((r) => Object.assign({}, r, { id: uid(), v: z12() }));
    p.despesas = base.despesas.map((d) => Object.assign({}, d, { id: uid(), lanc: [] }));
    p.ativos = base.ativos.map((a) => Object.assign({}, a, { id: uid(), ap: z12(), pr: z12() }));
  } else {
    p.rendas = [
      { id: uid(), cat: 'FIXA', area: 'Empregador', detalhe: 'Salário', v: z12() },
      { id: uid(), cat: 'FIXA', area: 'Empregador', detalhe: 'Vale-refeição', v: z12() },
      { id: uid(), cat: 'EXTRA', area: 'Serviços', detalhe: 'Projeto avulso', v: z12() },
    ];
    const dv = (area, nome) => ({ id: uid(), cat: 'VARIAVEL', area, nome, lanc: [] });
    p.despesas = [dv('Pessoal', 'Vestuário'), dv('Pessoal', 'Itens'), dv('Pessoal', 'Outros'), dv('Relacionamento', 'Presentes'), dv('Relacionamento', 'Encontros'), dv('Relacionamento', 'Outros')];
  }
  return p;
}

function pickYear() {
  const ref = S.profile && S.profile.anoRef;
  if (ref && S.years.includes(ref)) return ref;
  if (S.years.includes(NOW_Y)) return NOW_Y;
  return S.years.length ? S.years[S.years.length - 1] : (ref || NOW_Y);
}

/* ---------- persistência (conta ou navegador) ---------- */
const planPath = (y) => 'data/users/' + S.uid + '/plan-' + y;
const profilePath = () => 'data/users/' + S.uid + '/profile';
const anyBusy = () => SV.plan.dirty || SV.plan.saving || SV.profile.dirty || SV.profile.saving;

function statusText() {
  switch (S.save) {
    case 'pending': return 'Alterações pendentes…';
    case 'saving': return 'Salvando…';
    case 'saved': return S.mode === 'cloud' ? 'Salvo na sua conta' : 'Salvo neste navegador';
    case 'error': return 'Não foi possível salvar';
    default: return '';
  }
}
function setStatus(s) {
  S.save = s;
  $$('.save').forEach((el) => { el.dataset.s = s; el.textContent = statusText(); });
}

function touch(kind) {
  kind = kind || 'plan';
  const o = kind === 'plan' ? S.plan : S.profile;
  if (!o) return;
  o.updatedAt = Date.now();
  SV[kind].dirty = true;
  setStatus('pending');
  clearTimeout(SV[kind].timer);
  SV[kind].timer = setTimeout(() => flush(kind), 700);
}

async function persist(kind, o) {
  if (S.mode === 'cloud') {
    await S.db.doc(kind === 'plan' ? planPath(o.year) : profilePath()).set(o);
    return;
  }
  if (!lsSet(kind === 'plan' ? 'fluxo:plan:' + o.year : 'fluxo:profile', JSON.stringify(o))) throw new Error('storage');
  if (kind === 'plan') {
    S.docs[o.year] = clone(o);
    if (!S.years.includes(o.year)) { S.years.push(o.year); S.years.sort(); }
  }
}

async function flush(kind) {
  if (!kind) { await flush('plan'); await flush('profile'); return; }
  const sv = SV[kind];
  clearTimeout(sv.timer);
  const obj = kind === 'plan' ? S.plan : S.profile;
  if (sv.saving || !sv.dirty || !obj) return;
  sv.saving = true; sv.dirty = false; sv.failed = false;
  setStatus('saving');
  const snap = clone(obj);
  try {
    await persist(kind, snap);
    if (!anyBusy()) setStatus('saved');
  } catch (e) {
    sv.failed = true; sv.dirty = true;
    if (S.mode === 'cloud' && e && e.code === 'invalid_argument') {
      S.mode = 'local';
      S.notice = 'Sua conta não permite salvar dados nesta página. Os dados ficarão apenas neste navegador.';
      renderBanner();
      sv.failed = false;
      sv.timer = setTimeout(() => flush(kind), 100);
    } else {
      setStatus('error');
      sv.timer = setTimeout(() => flush(kind), 5000);
    }
  } finally {
    sv.saving = false;
    if (!sv.failed && sv.dirty) sv.timer = setTimeout(() => flush(kind), 250);
  }
}

function subscribe() {
  S.db.collection('data/users/' + S.uid).onSnapshot((snap) => {
    const docs = {}; let prof = null;
    snap.docs.forEach((d) => {
      if (!d.exists) return;
      if (d.id === 'profile') { prof = d.data(); return; }
      const m = /^plan-(\d{4})$/.exec(d.id);
      if (m) docs[+m[1]] = d.data();
    });
    S.docs = docs;
    S.years = Object.keys(docs).map(Number).sort();
    if (S.pendingCreate && docs[S.pendingCreate]) S.pendingCreate = null;
    if (prof) {
      const newer = !S.profile || (prof.updatedAt || 0) > (S.profile.updatedAt || 0);
      if (newer && !SV.profile.dirty && !SV.profile.saving) S.profile = hydrateProfile(clone(prof));
    } else if (!S.loaded) S.profile = null;
    if (S.year == null || (!docs[S.year] && S.pendingCreate !== S.year)) S.year = pickYear();
    const remote = docs[S.year];
    if (remote) {
      const cur = S.plan;
      const newer = !cur || cur.year !== S.year || (remote.updatedAt || 0) > (cur.updatedAt || 0);
      if (newer && !SV.plan.dirty && !SV.plan.saving) S.plan = hydrate(clone(remote));
    } else if (!SV.plan.dirty && !SV.plan.saving && S.pendingCreate !== S.year) {
      S.plan = null;
    }
    S.loaded = true;
    render({ soft: true });
  }, (err) => {
    console.error(err);
    goLocal('Não foi possível conectar ao armazenamento da sua conta. Os dados ficarão apenas neste navegador.');
  });
}

function loadLocal() {
  const years = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const m = /^fluxo:plan:(\d{4})$/.exec(localStorage.key(i) || '');
      if (m) years.push(+m[1]);
    }
  } catch (e) { /* sem armazenamento */ }
  years.sort();
  S.years = years; S.docs = {};
  years.forEach((y) => { try { S.docs[y] = JSON.parse(lsGet('fluxo:plan:' + y)); } catch (e) { /* ignora */ } });
  try { const pr = JSON.parse(lsGet('fluxo:profile') || 'null'); S.profile = pr ? hydrateProfile(pr) : null; } catch (e) { S.profile = null; }
  S.year = pickYear();
  S.plan = S.docs[S.year] ? hydrate(clone(S.docs[S.year])) : null;
  S.loaded = true;
}

function goLocal(msg) {
  S.mode = 'local'; S.notice = msg || '';
  loadLocal(); render();
}

async function switchYear(y) {
  await flush();
  S.year = y;
  S.plan = S.docs[y] ? hydrate(clone(S.docs[y])) : null;
  S.openDesp = new Set();
  render();
}

function createPlan(year, base) {
  S.plan = blankPlan(year, base);
  S.year = year; S.pendingCreate = year;
  SV.plan.dirty = true;
  flush('plan');
  render();
}

async function deletePlan(year) {
  clearTimeout(SV.plan.timer);
  SV.plan.dirty = false;
  try {
    if (S.mode === 'cloud') await S.db.doc(planPath(year)).delete();
    else { try { localStorage.removeItem('fluxo:plan:' + year); } catch (e) { /* ignora */ } }
  } catch (e) { toast('Não foi possível excluir agora. Tente de novo.'); return; }
  delete S.docs[year];
  S.years = S.years.filter((y) => y !== year);
  S.year = pickYear();
  S.plan = S.docs[S.year] ? hydrate(clone(S.docs[S.year])) : null;
  setStatus('idle');
  render();
}

/* ---------- jornada do cliente ---------- */
function resolveScreen() {
  if (S.profile) { S.screen = S.profile.onboarded ? 'app' : 'onboarding'; if (S.screen === 'onboarding') initOb(); }
  else S.screen = 'landing';
}

function initOb() {
  const p = S.profile;
  const pl = S.plan && S.plan.year === p.anoRef ? S.plan : S.docs[p.anoRef] || null;
  const st = (pl && pl.settings) || {};
  S.ob = {
    step: 0, nome: p.nome || '', anoRef: p.anoRef || NOW_Y, abas: p.abas.slice(),
    metaBase: st.metaBase != null ? st.metaBase : 2000, metaInvAno: st.metaInvAno || '',
    pctDesp: st.propostoPct != null ? +(st.propostoPct * 100).toFixed(2) : 12,
  };
}

function entrar() {
  if (S.profile) { S.screen = S.profile.onboarded ? 'app' : 'onboarding'; if (S.screen === 'onboarding') initOb(); render(); return; }
  if (S.years.length) {
    S.profile = newProfile({ plano: S.owner ? 'completo' : 'gratis', cobranca: 'ativo', anoRef: S.year || NOW_Y });
    touch('profile'); S.screen = 'onboarding'; initOb(); render(); return;
  }
  S.signup = { plano: 'gratis', aviso: 'Não encontramos uma conta neste acesso. Crie a sua para começar.' };
  S.screen = 'signup'; render();
}

function iniciarCompleto(from) {
  if (S.profile && S.profile.plano !== 'completo') { S.profile.plano = 'completo'; S.profile.cobranca = 'aguardando'; touch('profile'); }
  S.checkoutFrom = from || 'app'; S.screen = 'checkout'; closeAdmin(); render();
}

function ativarCodigo(raw) {
  const h = E.sha256(E.normCodigo(raw));
  if (!E.normCodigo(raw) || !CONFIG.codigosHash.includes(h)) return false;
  S.profile.plano = 'completo'; S.profile.cobranca = 'ativo'; S.profile.ativadoEm = Date.now();
  touch('profile');
  return true;
}

async function finishOb() {
  const o = S.ob; const p = S.profile;
  p.nome = o.nome.trim(); p.anoRef = +o.anoRef;
  p.abas = hydrateProfile({ abas: o.abas }).abas; p.onboarded = true;
  touch('profile');
  const y = p.anoRef;
  if (!S.docs[y] && !(S.plan && S.plan.year === y)) createPlan(y, null);
  else if (!S.plan || S.plan.year !== y) { S.year = y; S.plan = hydrate(clone(S.docs[y])); }
  S.plan.settings.metaBase = +o.metaBase || 0;
  S.plan.settings.propostoPct = Math.min(100, Math.max(0, +o.pctDesp || 0)) / 100;
  S.plan.settings.metaInvAno = +o.metaInvAno || 0;
  touch('plan');
  S.ob = null; S.screen = 'app'; S.view = 'geral';
  render();
}

/* ===== formatação, tabelas, edição, gráficos e modais ===== */
const nf = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const bf = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const fmt = (v) => (Math.abs(v) < 0.005 ? '–' : nf.format(v));
const brl = (v) => bf.format(Math.abs(v) < 0.005 ? 0 : v);
const pct = (v, d = 1) => (v == null || !isFinite(v) ? '–' : (v * 100).toLocaleString('pt-BR', { maximumFractionDigits: d }) + '%');
const fmtPct = (v) => (Math.abs(v) < 0.005 ? '–' : v.toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + '%');
const fmtPp = (v) => (Math.abs(v) < 0.05 ? '–' : (v > 0 ? '+' : '−') + Math.abs(v).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' pp');

const ic = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const I = {

};
const LOGO = '<svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#5ADBA8"/><path d="M8 20h14M8 15h9.5M8 10h5" stroke="#14281F" stroke-width="2.6" stroke-linecap="round"/></svg>';

/* ---------- edição de células ---------- */
const findCell = (ri, m) => document.querySelector(`td.ed[data-ri="${ri}"][data-m="${m}"]`);
const findAny = (ri) => document.querySelector(`td.ed[data-ri="${ri}"]`);
const isEditing = () => !!document.querySelector('.cell-input') || !!($('#modal') && $('#modal').open);
const isTyping = () => {
  const a = document.activeElement;
  return !!(a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) && !['checkbox', 'radio', 'file', 'button', 'submit'].includes(a.type) && (a.closest('#view') || a.closest('#admin')));
};

function neighbor(ri, m, dir) {
  if (dir === 'left' || dir === 'right') {
    const dm = dir === 'right' ? 1 : -1;
    for (let mm = m + dm; mm >= 0 && mm < 12; mm += dm) if (findCell(ri, mm)) return { ri, m: mm };
    return null;
  }
  const dr = dir === 'down' ? 1 : -1;
  for (let rr = ri + dr; rr >= 0 && rr < RI; rr += dr) {
    const c = findCell(rr, m) || findAny(rr);
    if (c) return { ri: rr, m: +c.dataset.m };
  }
  return null;
}

const CART_FIELD = { al: 'alvo', va: 'valor', pc: 'preco' };
const kindOf = (k) => (CART_FIELD[k] ? 'profile' : 'plan');

function cartEntry(key, create) {
  const c = S.profile.carteira;
  let e = c.find((x) => x.k === key);
  if (!e && create) { e = { k: key, alvo: 0, valor: null, preco: null }; c.push(e); }
  return e;
}

function applyCell(ds, val, empty) {
  const p = S.plan; const m = +ds.m;
  if (ds.k === 'ou') p.outros[m] = val;
  else if (ds.k === 'rd') { const r = p.rendas.find((x) => x.id === ds.id); if (r) r.v[m] = val; }
  else if (ds.k === 'ap' || ds.k === 'pr') { const a = p.ativos.find((x) => x.id === ds.id); if (a) a[ds.k][m] = val; }
  else if (ds.k === 'lv') {
    const [di, li] = ds.id.split('|');
    const d = p.despesas.find((x) => x.id === di);
    const l = d && d.lanc.find((x) => x.id === li);
    if (l) l.v = val;
  } else if (CART_FIELD[ds.k]) {
    const e = cartEntry(ds.id, true);
    e[CART_FIELD[ds.k]] = empty && ds.k !== 'al' ? null : val;
  }
  return kindOf(ds.k);
}

function paintCell(td, val) {
  td.classList.remove('editing', 'z', 'neg', 'auto');
  if (Math.abs(val) < 0.005) td.classList.add('z');
  if (val < -0.004) td.classList.add('neg');
  td.dataset.v = String(val);
  td.textContent = td.dataset.fmt === 'pct' ? fmtPct(val) : fmt(val);
}

function startEdit(td, seed) {
  if (td.classList.contains('editing')) return;
  const cur = +td.dataset.v || 0;
  const isPct = td.dataset.fmt === 'pct';
  const inp = document.createElement('input');
  inp.className = 'cell-input';
  inp.setAttribute('inputmode', 'decimal');
  inp.setAttribute('autocomplete', 'off');
  inp.setAttribute('aria-label', isPct ? 'Percentual' : 'Valor em reais');
  inp.value = seed != null ? seed : (Math.abs(cur) < 0.005 || td.classList.contains('auto') ? '' : String(cur).replace('.', ','));
  td.classList.add('editing');
  td.textContent = '';
  td.appendChild(inp);
  inp.focus();
  if (seed == null) inp.select(); else inp.setSelectionRange(inp.value.length, inp.value.length);
  let done = false;
  const finish = (mode, dir) => {
    if (done) return;
    const ri = +td.dataset.ri; const m = +td.dataset.m;
    if (mode === 'cancel') { done = true; paintCell(td, cur); td.focus(); return; }
    const raw = inp.value.replace('%', '');
    const empty = raw.trim() === '';
    const val = E.parseValor(raw);
    if (Number.isNaN(val)) {
      if (dir) { inp.classList.add('bad'); inp.select(); toast('Valor inválido. Use números como 1.234,56'); return; }
      done = true; paintCell(td, cur); toast('Valor inválido. A edição foi descartada.'); return;
    }
    done = true;
    const changed = Math.abs(val - cur) >= 0.005 || (empty && td.dataset.k !== 'al' && CART_FIELD[td.dataset.k] && !td.classList.contains('auto'));
    if (changed) { const kind = applyCell(td.dataset, val, empty); touch(kind); }
    if (dir) {
      const nxt = neighbor(ri, m, dir);
      S.pendingFocus = nxt || { ri, m };
      S.stale = false;
      paintCell(td, val);
      render();
    } else {
      paintCell(td, val);
      if (changed) S.stale = true;
    }
  };
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); finish('commit', e.shiftKey ? 'up' : 'down'); }
    else if (e.key === 'Tab') { e.preventDefault(); finish('commit', e.shiftKey ? 'left' : 'right'); }
    else if (e.key === 'Escape') { e.preventDefault(); finish('cancel'); }
  });
  inp.addEventListener('blur', () => finish('commit', null));
}

/* ---------- helpers de tabela ---------- */
const curCls = (m) => (S.year === NOW_Y && m === NOW_M ? 'cur' : '');
const cellCls = (v, m, extra) => ['num', curCls(m), Math.abs(v) < 0.005 ? 'z' : '', v < -0.004 ? 'neg' : '', extra || ''].filter(Boolean).join(' ');

function cell(v, m, o) {
  o = o || {};
  if (o.k) {
    const ti = FIRST_ED ? 0 : -1; FIRST_ED = false;
    const txt = o.fmt === 'pct' ? fmtPct(v) : fmt(v);
    return `<td class="${cellCls(v, o.col != null ? -1 : m, 'ed' + (o.auto ? ' auto' : ''))}" data-k="${o.k}" data-id="${esc(o.id || '')}" data-m="${m}" data-ri="${o.ri}" data-v="${v}"${o.fmt ? ` data-fmt="${o.fmt}"` : ''} tabindex="${ti}">${txt}</td>`;
  }

/* ---------- gráficos (SVG próprio) ---------- */
const niceStep = (raw) => {
  if (!(raw > 0)) return 1;
  const pow = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / pow;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * pow;
};
const tick = (v) => (Math.abs(v) >= 1000 ? (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + ' mil' : String(v));

function showTip(html, x, y) {
  const t = $('#tip'); t.innerHTML = html; t.hidden = false;
  const w = t.offsetWidth; const h = t.offsetHeight;
  let left = x + 14; if (left + w > window.innerWidth - 8) left = x - w - 14;
  let top = y - h - 12; if (top < 8) top = y + 16;
  t.style.left = Math.max(8, left) + 'px'; t.style.top = top + 'px';
}
const hideTip = () => { const t = $('#tip'); if (t) t.hidden = true; };

function drawBars(el, cfg) {
  if (!el) return;
  const W = Math.max(300, Math.floor(el.clientWidth || 640)); const H = 250;
  const m = { t: 12, r: 6, b: 26, l: 46 };
  const iw = W - m.l - m.r; const ih = H - m.t - m.b; const band = iw / 12;
  const pos = []; const neg = [];
  for (let i = 0; i < 12; i++) {
    let up = 0; let dn = 0;
    cfg.bars.forEach((s) => { const v = s.values[i]; if (v > 0) up += v; else dn += v; });
    pos.push(up); neg.push(dn);
  }
  const marks = cfg.marks || [];
  const hiV = Math.max(100, ...pos, ...marks.flatMap((k) => k.values));
  const loV = Math.min(0, ...neg);
  const step = niceStep((hiV - loV) / 4);
  const hi = Math.ceil(hiV / step) * step; const lo = Math.floor(loV / step) * step;
  const y = (v) => m.t + ih * (1 - (v - lo) / (hi - lo));
  let g = '';
  const n = Math.round((hi - lo) / step);
  for (let k = 0; k <= n; k++) {
    const v = lo + k * step; const yy = y(v);
    g += `<line x1="${m.l}" x2="${W - m.r}" y1="${yy}" y2="${yy}" stroke="${Math.abs(v) < 1e-9 ? 'var(--line-2)' : 'var(--line)'}"/><text x="${m.l - 8}" y="${yy + 4}" text-anchor="end">${tick(+v.toFixed(2))}</text>`;
  }
  const bw = Math.min(38, band * 0.62);
  let bars = ''; let mk = ''; let lab = '';
  for (let i = 0; i < 12; i++) {
    const x0 = m.l + band * i + (band - bw) / 2; let up = 0; let dn = 0;
    cfg.bars.forEach((s) => {
      const v = s.values[i]; if (Math.abs(v) < 0.005) return;
      let y1; let y2;
      if (v > 0) { y1 = y(up + v); y2 = y(up); up += v; } else { y1 = y(dn); y2 = y(dn + v); dn += v; }
      bars += `<rect x="${x0.toFixed(1)}" y="${Math.min(y1, y2).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, Math.abs(y2 - y1)).toFixed(1)}" rx="3" fill="${s.color}" stroke="var(--surface)" stroke-width="1.5"/>`;
    });
    marks.forEach((k) => { if (k.values[i] > 0) mk += `<line x1="${(x0 - 5).toFixed(1)}" x2="${(x0 + bw + 5).toFixed(1)}" y1="${y(k.values[i]).toFixed(1)}" y2="${y(k.values[i]).toFixed(1)}" stroke="${k.color}" stroke-width="3" stroke-linecap="round"/>`; });
    lab += `<text x="${(m.l + band * i + band / 2).toFixed(1)}" y="${H - 7}" text-anchor="middle" class="${cfg.noCur ? '' : S.year === NOW_Y && i === NOW_M ? 'cur-l' : ''}">${MES[i]}</text>`;
  }
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(cfg.aria)}">${g}${bars}${mk}${lab}<rect id="hv-${el.id}" x="0" y="${m.t}" width="${band}" height="${ih}" fill="var(--ink)" opacity="0" pointer-events="none"/></svg>`;
  const svg = el.firstChild; const hv = svg.querySelector('rect[id^="hv-"]');
  svg.addEventListener('pointermove', (e) => {
    const r = svg.getBoundingClientRect(); const i = Math.floor((e.clientX - r.left - m.l) / band);
    if (i < 0 || i > 11) { hideTip(); hv.setAttribute('opacity', '0'); return; }
    hv.setAttribute('x', (m.l + band * i).toFixed(1)); hv.setAttribute('opacity', '0.06');
    showTip(cfg.tip(i), e.clientX, e.clientY);
  });
  svg.addEventListener('pointerleave', () => { hideTip(); hv.setAttribute('opacity', '0'); });
}

/* ---------- modais ---------- */
function openModal(o) {
  const d = $('#modal');
  if (d.open) d.close();
  d.innerHTML = `<form class="mform" id="mform" novalidate><header><h3>${esc(o.title)}</h3></header><div class="mbody">${o.body || ''}<div class="merr" id="merr" role="alert"></div></div><footer>${o.danger ? `<button type="button" class="btn danger" id="m-danger">${esc(o.danger)}</button>` : ''}<span class="sp"></span>${o.noCancel ? '' : '<button type="button" class="btn" id="m-cancel">Cancelar</button>'}<button type="submit" class="btn primary">${esc(o.ok || 'Salvar')}</button></footer></form>`;
  const f = $('#mform');
  const err = (msg) => { $('#merr').textContent = msg; };
  f.addEventListener('submit', (ev) => {
    ev.preventDefault();
    const data = Object.fromEntries(new FormData(f).entries());
    if (o.onOk(data, err) !== false) closeModal();
  });
  if (!o.noCancel) $('#m-cancel').onclick = closeModal;
  if (o.danger) $('#m-danger').onclick = () => { if (o.onDanger() !== false) closeModal(); };
  d.showModal();
  const first = f.querySelector('input,select'); if (first) first.focus();
  return f;
}
const closeModal = () => { const d = $('#modal'); if (d.open) d.close(); };
function confirmBox(title, msg, okLabel, onYes) {
  openModal({ title, body: `<p class="mmsg">${esc(msg)}</p>`, ok: okLabel, onOk: () => { onYes(); } });
}
function infoBox(title, body) { openModal({ title, body, ok: 'Fechar', noCancel: true, onOk: () => true }); }

const sel = (name, opts, cur) => `<select name="${name}">${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;

/* ---------- arquivos: exportar e baixar ---------- */
const IN_PLATFORM = !!(window.claude && typeof window.claude.use === 'function');
const canDownload = () => !!S.downloads || !IN_PLATFORM;
async function save(filename, data) {
  try {
    if (S.downloads) { await S.downloads.save({ filename, data }); toast('Arquivo pronto para salvar.'); return; }
    const blob = new Blob([data]); const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('Download iniciado.');
  } catch (e) { if (!e || e.code !== 'declined') toast('Não foi possível gerar o arquivo agora.'); }
}
const csvNum = (v) => String(E.r2(v)).replace('.', ',');
const csvCell = (s) => '"' + String(s).replace(/"/g, '""') + '"';
function exportGeral() {
  const C = S.C;
  const rows = [['Salário (renda fixa)', C.rendaFixa], ['Dividendos', C.dividendos], ['Serviços (renda extra)', C.rendaExtra], ['Outros', C.outros], ['Total de entradas', C.receita],
    ['Investimentos', C.investAlocado], ['Conta corrente', C.despesas], ['Aportes', C.aportes], ['Saldo final (aplicado)', C.aplicado], ['Meta', C.meta], ['Valor proposto', C.proposto]];
  const lines = [['Linha', ...MES, 'Total'].map(csvCell).join(';')];
  rows.forEach(([l, v]) => lines.push([csvCell(l), ...v.map(csvNum), csvNum(E.sum(v))].join(';')));
  save(`financial-planning-${S.plan.year}-visao-geral.csv`, '\ufeff' + lines.join('\r\n'));
}
function exportLanc() {
  const lines = [['Mês', 'Categoria', 'Área', 'Despesa', 'Descrição', 'Valor'].map(csvCell).join(';')];
  S.plan.despesas.forEach((d) => d.lanc.slice().sort((a, b) => a.m - b.m).forEach((l) => lines.push([MES[l.m], d.cat === 'FIXA' ? 'Fixa' : 'Variável', d.area, d.nome, l.d].map(csvCell).concat(csvNum(l.v)).join(';'))));
  save(`financial-planning-${S.plan.year}-lancamentos.csv`, '\ufeff' + lines.join('\r\n'));
}

function assetRows(nodes, kind, field, flt, depth) {
  let h = '';
  for (const n of nodes) {
    if (n.leaf) {
      if (flt && !n.label.toLowerCase().includes(flt)) continue;
      const ri = RI++;
      h += `<tr><td class="lab"><div class="in" style="--d:${depth}"><span class="chev-sp"></span><button class="lnk" data-act="edit-ativo" data-id="${n.asset.id}">${esc(n.label)}</button></div></td>${cells(n.v, { k: field, id: n.asset.id, ri })}</tr>`;
    } else {
      const inner = assetRows(n.children, kind, field, flt, depth + 1);
      if (flt && !inner) continue;
      const open = flt ? true : !S.closed[kind].has(n.key);
      h += groupRow({ label: n.label, depth, v: n.v, kind, key: n.key, open }) + (open ? inner : '');
    }
  }
  return h;
}
function groupKeys(nodes, out) {
  for (const n of nodes) if (!n.leaf) { out.push(n.key); groupKeys(n.children, out); }
  return out;
}

const paras = (t) => String(t || '').split(/\n{2,}/).map((s) => s.trim()).filter(Boolean).map((s) => `<p>${esc(s)}</p>`).join('');
function readingHtml() {

async function askReading() {
  if (!S.sample || S.reading.state === 'loading') return;
  const C = S.C; const p = S.plan; const r2 = E.r2;
  const data = {
    ano: p.year, mes_atual: p.year === NOW_Y ? MES[NOW_M] : null,
    meses: MES.map((m, i) => ({ mes: m, entradas: r2(C.receita[i]), despesas: r2(C.despesas[i]), investimentos_alocados: r2(C.investAlocado[i]), aplicado: r2(C.aplicado[i]), dividendos: r2(C.dividendos[i]), meta_aplicacao: r2(C.meta[i]), despesas_propostas: r2(C.proposto[i]) })),
    despesas_por_item: p.despesas.map((d) => ({ area: d.area, item: d.nome, total: r2(E.sum(E.lancMeses(d))) })).filter((x) => x.total !== 0),
  };
  const prompt = `Você é um assistente de finanças pessoais. Abaixo estão os números mensais do planejamento do usuário, em reais.\n\n${JSON.stringify(data)}\n\nEscreva em português do Brasil, em no máximo 150 palavras e em até três parágrafos curtos, uma leitura objetiva: o que se destaca, o que merece atenção e uma pergunta útil para o usuário refletir. Meses com tudo zerado costumam ser meses futuros. Não recomende produtos ou ativos específicos e não use listas nem títulos.`;
  S.reading = { state: 'loading', text: '', error: '' };
  render();
  try {
    const res = await S.sample(prompt, { modelTier: 'quick', onText: (u) => { S.reading.text = u.text; const el = $('#reading-body'); if (el) el.innerHTML = paras(u.text) || '<p>Lendo seus números…</p>'; } });
    S.reading = { state: 'done', text: res.text, error: '' };
  } catch (e) {
    const msg = e && e.code === 'not_granted' ? 'A permissão para usar o Claude foi negada.' : e && e.code === 'rate_limited' ? 'Muitos pedidos seguidos. Espere um pouco e tente de novo.' : 'Não foi possível gerar a leitura agora.';
    S.reading = { state: 'error', text: '', error: msg };
  }
  render();
}

function suggest(level, a) {
  const own = new Set();
  const T = TAXONOMIA;
  if (level === 'tipo') Object.keys(T).forEach((k) => own.add(k));
  if (level === 'classe' && T[a.tipo]) Object.keys(T[a.tipo]).forEach((k) => own.add(k));
  if (level === 'grupo' && T[a.tipo] && T[a.tipo][a.classe] && !Array.isArray(T[a.tipo][a.classe])) Object.keys(T[a.tipo][a.classe]).forEach((k) => own.add(k));
  if (level === 'subgrupo' && T[a.tipo] && T[a.tipo][a.classe] && Array.isArray(T[a.tipo][a.classe][a.grupo])) T[a.tipo][a.classe][a.grupo].forEach((k) => own.add(k));
  S.plan.ativos.forEach((x) => {
    if (level === 'tipo') own.add(x.tipo);
    else if (x.tipo === a.tipo && level === 'classe') own.add(x.classe);
    else if (x.tipo === a.tipo && x.classe === a.classe && level === 'grupo' && x.grupo) own.add(x.grupo);
    else if (x.tipo === a.tipo && x.classe === a.classe && x.grupo === a.grupo && level === 'subgrupo' && x.subgrupo) own.add(x.subgrupo);
  });
  return [...own];
}
const matchCase = (val, list) => { const t = (val || '').trim(); const f = list.find((x) => x.toLowerCase() === t.toLowerCase()); return f || t; };

/* ===== Carteira: alocação-alvo e rebalanceamento por aportes ===== */
function positions() {
  const map = {};
  const years = S.years.slice();
  if (S.plan && !years.includes(S.plan.year)) years.push(S.plan.year);
  years.forEach((y) => {
    const pl = S.plan && S.plan.year === y ? S.plan : S.docs[y];
    if (!pl) return;
    (pl.ativos || []).forEach((a) => { const k = E.ativoKey(a); map[k] = (map[k] || 0) + E.sum((a.ap || []).map((x) => +x || 0)); });
  });
  return map;
}

function cartModel() {
  const p = S.plan; const pos = positions();
  const items = p.ativos.map((a) => {
    const k = E.ativoKey(a); const e = S.profile.carteira.find((x) => x.k === k) || {};
    const manual = e.valor != null;
    return { a, k, alvo: +e.alvo || 0, valor: manual ? Math.max(0, +e.valor) : Math.max(0, pos[k] || 0), auto: !manual, preco: e.preco > 0 ? +e.preco : null };
  });
  const sumAlvo = items.reduce((s, i) => s + i.alvo, 0);
  const total = items.reduce((s, i) => s + i.valor, 0);
  const mes = S.cart.mes == null ? (p.year === NOW_Y ? NOW_M : 0) : S.cart.mes;
  const planejado = Math.max(0, S.C.investAlocado[mes]);
  const aporte = S.cart.aporte != null ? S.cart.aporte : (planejado > 0 ? planejado : p.settings.metaBase);
  const rb = E.rebalance(items.map((i) => ({ w: i.alvo, v: i.valor })), aporte);
  items.forEach((i, n) => {
    i.sug = rb.alloc[n];
    i.pctAtual = total > 0 ? (i.valor / total) * 100 : 0;
    i.pctAlvo = rb.W > 0 ? (i.alvo / rb.W) * 100 : 0;
    i.desvio = i.pctAtual - i.pctAlvo;
    i.apos = total + aporte > 0 ? ((i.valor + i.sug) / (total + aporte)) * 100 : 0;
    i.cotas = i.preco && i.sug > 0 ? Math.floor(i.sug / i.preco + 1e-9) : null;
  });
  return { items, sumAlvo, total, mes, planejado, aporte, rb };
}
